<script>const DECK={"meeting": 21, "title": "Relations", "acts": ["A cycle of wins", "Pairs, arrows, matrices", "Properties and witnesses", "Equivalence", "Partial and total orders", "Synthesis"], "slides": [{"act": 0, "title": "Can winning go<br>in a circle?", "body": "<p>Three fair spinners. Each sector is equally likely. The larger number wins.</p><div class=\"task\"><b>Try it first</b><p>You choose first. Which spinner would you take?</p></div>", "scene": "spinners", "cover": true}, {"act": 0, "title": "Count every possible matchup", "body": "<div class=\"task\"><b>Try it first</b><p>For the selected pair, which spinner wins each of the nine equally likely outcomes?</p></div><p>Click a square to test one outcome. Then compare all three matchups.</p>", "scene": "matchup"}, {"act": 0, "title": "A relation can record a cycle", "body": "<p>Write X R Y when X wins more than half of the pairings against Y.</p><div class=\"task\"><b>Try it first</b><p>Draw the three arrows. Does “beats” behave like “is greater than”?</p></div>", "scene": "spinnerCycle"}, {"act": 1, "title": "Choose some ordered pairs", "body": "<p>A <em>relation on A</em> is a subset of A × A.</p><div class=\"equation\">a R b ⇔ (a,b) ∈ R</div><p>Change a matrix entry. The pair set and directed graph change with it.</p>", "scene": "editor", "edges": [[0, 0], [0, 2], [1, 0], [2, 1]]}, {"act": 1, "title": "Relations can join different sets", "body": "<p>Let A = {Ada, Bo} and B = {Art, CS, Math}. A relation from A to B records who takes which course.</p><div class=\"equation\">R ⊆ A × B</div><div class=\"task\"><b>Try it first</b><p>Give Ada two courses and Bo none. Is this still a relation?</p></div>", "scene": "enrollment"}, {"act": 1, "title": "First coordinate: tail. Second: head.", "body": "<div class=\"task\"><b>Try it first</b><p>Build R = {(1,1), (1,3), (2,1), (3,2)}. Use the cells to add arrows, including the loop.</p></div><p>Could an undirected graph preserve all this information?</p>", "scene": "editor", "edges": [], "target": [[0, 0], [0, 2], [1, 0], [2, 1]], "activity": "encode"}, {"act": 1, "title": "Rows send. Columns receive.", "body": "<p>The row names the <em>first coordinate</em>; the column names the second.</p><div class=\"equation\">M[i,j] = 1 ⇔ i R j</div><div class=\"task\"><b>Try it first</b><p>Hover or focus an entry. Follow its arrow, then read its ordered pair.</p></div>", "scene": "editor", "edges": [[0, 0], [0, 2], [1, 0], [2, 1]]}, {"act": 1, "title": "A matrix is another view of the relation", "body": "<div class=\"task\"><b>Try it first</b><p>Encode the worksheet relation, then read the entries equal to 1 back into ordered pairs.</p></div><p>Count the pairs, arrows (including loops), and entries equal to 1. They must agree.</p><div class=\"equation\">R = {(1,1), (1,3), (2,1), (3,2)}</div>", "scene": "editor", "edges": [], "target": [[0, 0], [0, 2], [1, 0], [2, 1]], "activity": "encode", "formula": "R = {(1,1), (1,3), (2,1), (3,2)}"}, {"act": 2, "title": "Four different questions", "body": "<p><em>Reflexive:</em> all self-pairs?</p><p><em>Symmetric:</em> all reverse pairs?</p><p><em>Antisymmetric:</em> no two-way pair of distinct elements?</p><p><em>Transitive:</em> every required shortcut?</p>", "scene": "editor", "edges": [[0, 0], [1, 1], [2, 2], [0, 1], [1, 0]], "activity": "audit"}, {"act": 2, "title": "Does every vertex have its loop?", "body": "<p>Reflexivity is a statement about <em>every element</em>.</p><div class=\"equation\">∀a ∈ A, a R a</div><div class=\"task\"><b>Try it first</b><p>Find what is missing. Add the required pair.</p></div>", "scene": "editor", "edges": [[0, 0], [1, 1], [0, 1]], "goal": "reflexive"}, {"act": 2, "title": "Some loops means neither", "body": "<p><em>Reflexive:</em> every element has a loop.</p><p><em>Irreflexive:</em> no element has a loop.</p><div class=\"task\"><b>Try it first</b><p>Try no loops, some loops, and all loops. Is “not reflexive” the same as “irreflexive”?</p></div>", "scene": "editor", "edges": [[0, 0]], "activity": "loops"}, {"act": 2, "title": "Does every arrow have a reverse?", "body": "<p>Symmetry requires a reverse whenever an arrow is present.</p><div class=\"equation\">a R b ⇒ b R a</div><div class=\"task\"><b>Try it first</b><p>Find a present arrow whose reverse is missing.</p></div>", "scene": "editor", "edges": [[0, 1], [1, 2], [2, 1]], "goal": "symmetric"}, {"act": 2, "title": "Two-way arrows between distinct vertices", "body": "<p>Antisymmetry allows loops, but forbids arrows both ways between different elements.</p><div class=\"equation\">(a R b ∧ b R a) ⇒ a = b</div><div class=\"task\"><b>Try it first</b><p>Find a counterexample. Can you repair it by removing just one arrow?</p></div>", "scene": "editor", "edges": [[0, 0], [1, 1], [2, 2], [0, 1], [1, 0]], "goal": "antisymmetric"}, {"act": 2, "title": "Symmetric and antisymmetric can coexist", "body": "<div class=\"task\"><b>Try it first</b><p>Classify each example. Then edit it to change the answer.</p></div><p>The equality relation has only loops. Think about what each implication actually requires.</p>", "scene": "editor", "edges": [[0, 0], [1, 1], [2, 2]], "activity": "symmetry"}, {"act": 2, "title": "Two steps demand a shortcut", "body": "<p>Transitivity requires the third pair whenever the first two are present.</p><div class=\"equation\">(a R b ∧ b R c) ⇒ a R c</div><div class=\"task\"><b>Try it first</b><p>Follow the two arrows. Which shortcut is required?</p></div>", "scene": "editor", "edges": [[0, 1], [1, 2]], "goal": "transitive"}, {"act": 2, "title": "The vertices may repeat", "body": "<div class=\"task\"><b>Try it first</b><p>What does 1 → 2 → 1 require? What about 2 → 1 → 2?</p></div><p>The definition does not require a, b, c to be distinct.</p>", "scene": "editor", "edges": [[0, 1], [1, 0]], "goal": "transitive"}, {"act": 2, "title": "A repair can create a new obligation", "body": "<div class=\"task\"><b>Try it first</b><p>Make this four-vertex relation transitive using only additional arrows.</p></div><p>After each addition, check again. New two-step paths can appear.</p>", "scene": "editor", "labels": ["1", "2", "3", "4"], "edges": [[0, 1], [1, 2], [2, 3]], "goal": "transitive", "layout": "chain"}, {"act": 2, "title": "Audit the worksheet relation", "body": "<div class=\"task\"><b>Try it first</b><p>Predict all four properties of S. For a failure, name a counterexample. For a success, explain why every case works.</p></div><div class=\"equation\">S = {(1,1), (2,2), (3,3),<br>(1,2), (2,1)}</div>", "scene": "editor", "edges": [[0, 0], [1, 1], [2, 2], [0, 1], [1, 0]], "activity": "audit"}, {"act": 2, "title": "One witness disproves a universal claim", "body": "<p>A finite check must cover every relevant case. A failed case is a <em>counterexample</em>.</p><p>An argument for all integers needs arbitrary integers, not just a small picture.</p><div class=\"task\"><b>Try it first</b><p>Find a transitivity witness in the spinner relation.</p></div>", "scene": "editor", "labels": ["A", "B", "C"], "edges": [[0, 1], [1, 2], [2, 0]], "goal": "transitive"}, {"act": 3, "title": "Equivalence means consistent sameness", "body": "<p>An <em>equivalence relation</em> is reflexive, symmetric, and transitive.</p><div class=\"task\"><b>Try it first</b><p>Here a R b means “same remainder modulo 3.” Why do arrows stay within the colored groups?</p></div><p>This finite picture is a preview. Next meeting develops the groups themselves.</p>", "scene": "equivalence", "labels": ["0", "3", "1", "4", "2", "5"]}, {"act": 3, "title": "Congruence can connect distant integers", "body": "<p>On ℤ, define a ∼ b when 5 divides b − a.</p><div class=\"equation\">a ∼ b ⇔ b − a = 5k<br>for some k ∈ ℤ</div><div class=\"task\"><b>Try it first</b><p>Select an integer. Which displayed integers are related to it?</p></div>", "scene": "modNumbers"}, {"act": 3, "title": "Prove it for arbitrary integers", "body": "<div class=\"task\"><b>Try it first</b><p>Prove that 5 | (b − a) defines an equivalence relation. Name the integer witnesses.</p></div><p>Choose a property, try its argument, then reveal one line at a time.</p>", "scene": "modProof"}, {"act": 4, "title": "An order organizes comparisons", "body": "<p>A <em>partial order</em> is reflexive, antisymmetric, and transitive.</p><p>On {1,2,3,6}, draw a → b when a divides b.</p><div class=\"task\"><b>Try it first</b><p>Verify the three required properties.</p></div>", "scene": "order", "labels": ["1", "2", "3", "6"], "edges": [[0, 0], [0, 1], [0, 2], [0, 3], [1, 1], [1, 3], [2, 2], [2, 3], [3, 3]], "layout": "diamond"}, {"act": 4, "title": "Partial orders allow incomparable pairs", "body": "<div class=\"task\"><b>Try it first</b><p>Compare 2 and 3. Does either divide the other? Now compare 2 and 6.</p></div><p>A partial order satisfies all three axioms even when some pairs cannot be compared.</p>", "scene": "order", "labels": ["1", "2", "3", "6"], "edges": [[0, 0], [0, 1], [0, 2], [0, 3], [1, 1], [1, 3], [2, 2], [2, 3], [3, 3]], "layout": "diamond", "activity": "compare"}, {"act": 4, "title": "Different objects, the same order pattern", "body": "<p>Subset inclusion orders the subsets of {p,q}.</p><div class=\"task\"><b>Try it first</b><p>Compare {p} and {q}. Then match the four subsets to the divisibility diagram.</p></div><p>Every subset includes itself; inclusion chains compose.</p>", "scene": "order", "labels": ["∅", "{p}", "{q}", "{p,q}"], "edges": [[0, 0], [0, 1], [0, 2], [0, 3], [1, 1], [1, 3], [2, 2], [2, 3], [3, 3]], "layout": "diamond", "activity": "subset"}, {"act": 4, "title": "A total order compares every pair", "body": "<p>A <em>total order</em> is a partial order in which every pair is comparable.</p><div class=\"equation\">a R b or b R a</div><div class=\"task\"><b>Try it first</b><p>Switch between divisibility and ≤ on the same four numbers. Which comparison is added?</p></div>", "scene": "order", "labels": ["1", "2", "3", "6"], "edges": [[0, 0], [0, 1], [0, 2], [0, 3], [1, 1], [1, 3], [2, 2], [2, 3], [3, 3]], "layout": "diamond", "activity": "total"}, {"act": 4, "title": "Why specify positive integers?", "body": "<p>For divisibility on ℤ⁺, opposing divisibility forces equality.</p><div class=\"task\"><b>Try it first</b><p>What changes if we include −2 and 2? Test antisymmetry.</p></div><div class=\"equation\">−2 | 2 and 2 | −2</div>", "scene": "editor", "labels": ["−2", "2"], "edges": [[0, 0], [0, 1], [1, 0], [1, 1]], "goal": "antisymmetric", "lock": true}, {"act": 5, "title": "Equivalence and order ask different questions", "body": "<p><em>Equivalence:</em> which objects count as the same?</p><p><em>Order:</em> which objects precede or compare with which?</p><div class=\"task\"><b>Try it first</b><p>Classify the displayed relation. Can one relation be both?</p></div>", "scene": "editor", "edges": [[0, 0], [1, 1], [2, 2]], "activity": "classify"}, {"act": 5, "title": "Build a relation that meets the conditions", "body": "<div class=\"task\"><b>Try it first</b><p>Choose a challenge. Add or remove pairs, then test your construction.</p></div><p>There may be several correct answers. Explain why yours works.</p>", "scene": "editor", "edges": [], "activity": "challenge"}, {"act": 5, "title": "Return to the cycle of wins", "body": "<div class=\"task\"><b>Try it first</b><p>Explain the spinner paradox using the language of relations.</p></div><p>Name two present pairs and the missing pair that defeats transitivity.</p>", "scene": "spinnerCycle", "returning": true}, {"act": 5, "title": "Pairs first. Properties next.", "body": "<p>Translate between pairs, arrows, and matrix entries.</p><p>For a failed property, give a precise witness. For a proof, cover every required case.</p><p><em>Next:</em> equivalence classes and partitions.</p>", "scene": "equivalence", "labels": ["0", "3", "1", "4", "2", "5"]}]};'use strict';
const $=s=>document.querySelector(s);
const C={teal:'#087f6d',blue:'#286bab',coral:'#c5473a',gold:'#b47a0b',purple:'#7451bc',ink:'#172439',muted:'#526078'};
const PROPS=['reflexive','symmetric','antisymmetric','transitive'];
const PROP_LABELS=['Reflexive','Symmetric','Antisymmetric','Transitive'];
const SPINNERS=[[2,4,9],[1,6,8],[3,5,7]],NAMES=['A','B','C'];
let state={},index=0,timer=null,graphSerial=0;
const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const pairKey=(a,b)=>a+','+b;
const cloneEdges=edges=>edges.map(e=>[...e]);
function freshState(s){return {edges:cloneEdges(s.edges||[]),checked:false,witness:0,step:s.returning?3:0,match:0,shown:Array.from({length:3},()=>Array(9).fill(false)),spins:[0,0,0],spun:false,proof:0,proofStep:0,selected:2,showRelated:false,orderKind:'divides',orderProof:0,view:'full',comparison:0,compareShown:false,swap:false,answers:['?','?','?','?'],challenge:0};}
function st(){return state[index]||(state[index]=freshState(DECK.slides[index]));}
function cleanDeckStates(raw){
 const result={};if(!raw||typeof raw!=='object'||Array.isArray(raw))return result;
 const integer=(v,a,b)=>Number.isInteger(v)&&v>=a&&v<=b;
 for(const [key,v] of Object.entries(raw)){
  const i=Number(key);if(!integer(i,0,DECK.slides.length-1)||!v||typeof v!=='object'||Array.isArray(v))continue;
  const s=DECK.slides[i],q=freshState(s),n=s.scene==='enrollment'?2:(s.labels||['1','2','3']).length,m=s.scene==='enrollment'?3:n;
  if(Array.isArray(v.edges)&&v.edges.length<=n*m){q.edges=[];const seen=new Set();for(const e of v.edges)if(Array.isArray(e)&&e.length===2&&integer(e[0],0,n-1)&&integer(e[1],0,m-1)&&!seen.has(pairKey(...e))){q.edges.push([e[0],e[1]]);seen.add(pairKey(...e));}}
  for(const k of ['checked','spun','showRelated','compareShown','swap'])q[k]=v[k]===true;
  for(const [k,a,b] of [['witness',0,1000],['step',0,3],['match',0,2],['proof',0,2],['proofStep',0,3],['orderProof',0,3],['selected',-5,15],['comparison',0,3],['challenge',0,2]])if(integer(v[k],a,b))q[k]=v[k];
  if(integer(v.vertex,0,n-1))q.vertex=v.vertex;
  if(Array.isArray(v.spins)&&v.spins.length===3&&v.spins.every(x=>integer(x,0,2)))q.spins=[...v.spins];
  if(Array.isArray(v.shown)&&v.shown.length===3&&v.shown.every(row=>Array.isArray(row)&&row.length===9))q.shown=v.shown.map(row=>row.map(x=>x===true));
  if(['divides','le'].includes(v.orderKind))q.orderKind=v.orderKind;
  if(['full','hasse'].includes(v.view))q.view=v.view;
  if(Array.isArray(v.answers)&&v.answers.length===4&&v.answers.every(x=>['?','yes','no'].includes(x)))q.answers=[...v.answers];
  result[i]=q;
 }
 return result;
}
function audit(edges,n){
 const set=new Set(edges.map(e=>pairKey(...e))),has=(a,b)=>set.has(pairKey(a,b));
 const violations={reflexive:[],symmetric:[],antisymmetric:[],transitive:[]};
 for(let a=0;a<n;a++){
  if(!has(a,a))violations.reflexive.push({vertices:[a],present:[],missing:[[a,a]],repair:['add',a,a]});
  for(let b=0;b<n;b++){
   if(has(a,b)&&!has(b,a))violations.symmetric.push({vertices:[a,b],present:[[a,b]],missing:[[b,a]],repair:['add',b,a]});
   if(a<b&&has(a,b)&&has(b,a))violations.antisymmetric.push({vertices:[a,b],present:[[a,b],[b,a]],missing:[],repair:['remove',b,a]});
   for(let c=0;c<n;c++)if(has(a,b)&&has(b,c)&&!has(a,c))violations.transitive.push({vertices:[a,b,c],present:[[a,b],[b,c]],missing:[[a,c]],repair:['add',a,c]});
  }
 }
 const ok=Object.fromEntries(PROPS.map(k=>[k,violations[k].length===0]));
 ok.irreflexive=Array.from({length:n},(_,i)=>!has(i,i)).every(Boolean);
 ok.equivalence=ok.reflexive&&ok.symmetric&&ok.transitive;
 ok.partial=ok.reflexive&&ok.antisymmetric&&ok.transitive;
 ok.total=ok.partial&&Array.from({length:n},(_,a)=>Array.from({length:n},(_,b)=>has(a,b)||has(b,a)).every(Boolean)).every(Boolean);
 return {ok,violations};
}
function model(s,q){
 let labels=s.labels||['1','2','3'],edges=q.edges,layout=s.layout||'triangle';
 if(s.scene==='equivalence'){edges=labels.flatMap((a,i)=>labels.flatMap((b,j)=>Number(a)%3===Number(b)%3?[[i,j]]:[]));layout='groups';}
 if(s.scene==='order'){
  if(s.activity==='subset'&&q.swap)labels=['1','2','3','6'];
  edges=s.activity==='total'&&q.orderKind==='le'?labels.flatMap((_,i)=>labels.flatMap((_,j)=>i<=j?[[i,j]]:[])):s.edges;
  layout=s.activity==='total'&&q.orderKind==='le'?'chain':'diamond';
 }
 return {labels,edges,layout};
}
const btn=(label,a,extra='')=>`<button type="button" data-action="${a}" ${extra}>${label}</button>`;
const selector=(id,label,options,value)=>`<label>${label}<select data-setting="${id}" aria-label="${label}">${options.map(([v,t])=>`<option value="${v}" ${String(value)===String(v)?'selected':''}>${t}</option>`).join('')}</select></label>`;
const svg=(content,label,view='0 0 820 420')=>`<svg viewBox="${view}" role="group" aria-label="${esc(label)}">${content}</svg>`;
const text=(x,y,t,size=22,color=C.ink,extra='')=>`<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="${size}" fill="${color}" ${extra}>${esc(t)}</text>`;
function positions(n,layout){
 if(layout==='groups')return [[80,85],[80,270],[225,85],[225,270],[370,85],[370,270]];
 if(n===2)return [[115,185],[335,185]];
 if(layout==='chain')return Array.from({length:n},(_,i)=>[65+320*i/(n-1),300-245*i/(n-1)]);
 if(n===4)return [[225,300],[85,175],[365,175],[225,50]];
 return [[225,65],[85,280],[365,280]];
}
function arrowPath(points,a,b){
 const [x,y]=points[a],[u,v]=points[b],r=27;
 if(a===b){const theta=Math.atan2(y-185,x-225),p=t=>[x+r*Math.cos(t),y+r*Math.sin(t)],start=p(theta-.65),end=p(theta+.65),c1=[x+82*Math.cos(theta-.65),y+82*Math.sin(theta-.65)],c2=[x+82*Math.cos(theta+.65),y+82*Math.sin(theta+.65)];return `M${start} C${c1} ${c2} ${end}`;}
 const dx=u-x,dy=v-y,len=Math.hypot(dx,dy),nx=dx/len,ny=dy/len,offset=17;
 return `M${x+nx*r},${y+ny*r} Q${(x+u)/2-ny*offset},${(y+v)/2+nx*offset} ${u-nx*r},${v-ny*r}`;
}
function diagram(labels,edges,{layout='triangle',witness=null,bad=false,readonly=false,hasse=false,selected=-1,groups=false}={}){
 const points=positions(labels.length,layout),id='arrow-'+(++graphSerial),has=(a,b)=>edges.some(e=>e[0]===a&&e[1]===b);
 const palette=[C.muted,C.blue,C.gold,C.coral,C.purple];
 let out='<defs>'+palette.map((c,k)=>`<marker id="${id}-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="${c}"/></marker>`).join('')+'</defs>';
 if(groups)for(let i=0;i<3;i++)out+=`<rect x="${points[2*i][0]-48}" y="30" width="96" height="295" rx="48" fill="${['#e0f1eb','#e4ebfa','#f2e8fb'][i]}"/>`;
 let shown=hasse?edges.filter(([a,b])=>a!==b&&!labels.some((_,k)=>k!==a&&k!==b&&has(a,k)&&has(k,b))):edges;
 for(const [a,b] of shown){
  const marked=witness?.present.some(e=>e[0]===a&&e[1]===b),colorIndex=marked?(bad?3:1):0,key=pairKey(a,b),d=arrowPath(points,a,b);
  out+=`<g class="relation-arrow" data-focus="${key}" ${readonly?'':`role="button" tabindex="0" data-action="pair" data-i="${a}" data-j="${b}" aria-label="Remove pair (${esc(labels[a])}, ${esc(labels[b])})"`}><path class="hit" d="${d}"/><path class="visible" d="${d}" stroke="${palette[colorIndex]}" stroke-width="${marked?4.5:3}" fill="none" ${hasse?'':`marker-end="url(#${id}-${colorIndex})"`}/></g>`;
 }
 if(witness)for(const [a,b] of witness.missing)out+=`<path d="${arrowPath(points,a,b)}" fill="none" stroke="${C.gold}" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#${id}-2)"/>`;
 labels.forEach((label,i)=>{const [x,y]=points[i],marked=witness?.vertices.includes(i)||i===selected;out+=`<g class="relation-node" data-action="node" data-i="${i}" role="button" tabindex="0" aria-label="Highlight element ${esc(label)}"><circle cx="${x}" cy="${y}" r="26" fill="${marked?'#fff3d9':'white'}" stroke="${marked?C.gold:C.teal}" stroke-width="3"/>${text(x,y,label,label.length>3?17:23)}</g>`;});
 return svg(out,'Directed relation on '+labels.join(', '),'0 0 450 370');
}
function matrix(labels,edges,{columns=labels,witness=null,bad=false,readonly=false}={}){
 const has=(a,b)=>edges.some(e=>e[0]===a&&e[1]===b),is=(list,a,b)=>list?.some(e=>e[0]===a&&e[1]===b);
 return `<div class="matrix-wrap"><div class="matrix-caption">column = destination</div><table class="relation-matrix ${labels.length>4?'compact':''}" aria-label="Relation matrix: row is first coordinate, column is second"><thead><tr><th scope="col">↓ / →</th>${columns.map(l=>`<th scope="col">${esc(l)}</th>`).join('')}</tr></thead><tbody>`+labels.map((label,a)=>`<tr><th scope="row">${esc(label)}</th>`+columns.map((to,b)=>`<td><button type="button" class="${has(a,b)?'on ':''}${is(witness?.present,a,b)?(bad?'bad ':'hypothesis '):''}${is(witness?.missing,a,b)?'missing':''}" data-action="pair" data-i="${a}" data-j="${b}" data-focus="${a},${b}" aria-label="Pair (${esc(label)}, ${esc(to)})" aria-pressed="${has(a,b)}" ${readonly?'disabled':''}>${has(a,b)?1:0}</button></td>`).join('')+'</tr>').join('')+'</tbody></table></div>';
}
function pairs(labels,edges,columns=labels){return '<div class="relation-pairs">R = { '+edges.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]).map(([a,b])=>`<span class="pair" data-focus="${a},${b}">(${esc(labels[a])}, ${esc(columns[b])})</span>`).join(', ')+' }</div>';}
function evidence(goal,w,labels){
 if(!w)return `Every required case is covered on this ${labels.length}-element set.`;
 const v=w.vertices.map(i=>labels[i]);
 if(goal==='reflexive')return `Missing self-pair: (${v[0]}, ${v[0]}).`;
 if(goal==='symmetric')return `${v[0]} → ${v[1]} is present; ${v[1]} → ${v[0]} is missing.`;
 if(goal==='antisymmetric')return `${v[0]} ≠ ${v[1]}, but both directions are present.`;

}

 function validInt(x,lo,hi){return Number.isInteger(x)&&x>=lo&&x<=hi;}
 function cleanStates(raw){if(typeof cleanDeckStates==='function')return cleanDeckStates(raw);let result={};if(!raw||typeof raw!=='object'||Array.isArray(raw))return result;

   const s=DECK.slides[i],max=s.scene==='route'?s.route.length-1:({pathCycle:3,longestPath:2,deleteAudit:2,spanningSteps:6,traversal:9,weightedTree:2,uniqueExplore:1,boundaryWalk:3,spiderModel:3,build:3,districtMap:2}[s.scene]||0);
   const q={step:validInt(v.step,0,max)?v.step:0,toggle:v.toggle===true,palette:validInt(v.palette,0,colors.length-1)?v.palette:0,assigned:[],face:-1};
   const colorCount=s.scene==='districtMap'?districtGraph.p.length:s.scene==='map'?4:s.scene==='colorGraph'?G[s.graph].p.length:0;
   if(Array.isArray(v.assigned))q.assigned=Array.from(v.assigned.slice(0,colorCount),c=>validInt(c,-1,colors.length-1)?c:-1);

   if(typeof v.message==='string')q.message=v.message.slice(0,1000).replace(/[<>&]/g,'');
   if(validInt(v.example,0,s.scene==='countLab'?countExamples.length-1:3))q.example=v.example;
   if(Array.isArray(v.countShown))q.countShown=v.countShown.slice(0,4).map(x=>x===true);
   if(Array.isArray(v.active)&&v.active.length<=12&&v.active.every(x=>validInt(x,0,11)))q.active=[...new Set(v.active)];
   if(v.root===0||v.root===5)q.root=v.root;
   if(['pre','in','post'].includes(v.order))q.order=v.order;
   if(s.scene==='route'&&[350,700,1400].includes(v.routeDelay))q.routeDelay=v.routeDelay;

 function validatePayload(data){
  if(!data||!(data.version===1||(TEXT_ENABLED&&data.version===2))||data.deck!==fingerprint||!data.slides||typeof data.slides!=='object'||Array.isArray(data.slides))throw Error(`This backup does not match this version of meeting ${DECK.meeting}.`);
  let result={},total=0;
  for(const [key,list] of Object.entries(data.slides)){
   const i=Number(key);if(!validInt(i,0,DECK.slides.length-1)||!Array.isArray(list)||list.length>10000)throw Error('Invalid slide data.');
   const textIds=new Set();result[i]=list.map(s=>{
    if(s?.tool==='text'&&textTools){const box=textTools.validate(s);if(textIds.has(box.id))throw Error('Duplicate text box.');textIds.add(box.id);return box;}
    if(!s||!['pen','highlight'].includes(s.tool)||!/^#[0-9a-f]{6}$/i.test(s.color)||!Number.isFinite(s.width)||s.width<1||s.width>100||!Array.isArray(s.points)||!s.points.length)throw Error('Invalid ink stroke.');

 function eraseBetween(a,b){const g=gesture;if(!g)return;const before=strokes(g.slide);ink[g.slide]=before.filter(s=>{if(s.tool==='text')return true;const radius=10+s.width/2;if(s.points.length===1)return pointSegment(s.points[0],a,b)>radius;for(let j=1;j<s.points.length;j++)if(segmentsDistance(a,b,s.points[j-1],s.points[j])<=radius)return false;return true;});if(ink[g.slide].length!==before.length)g.erased=true;requestDraw();}
 layer.addEventListener('pointerdown',e=>{if(mode==='use'||gesture||(e.pointerType==='mouse'&&e.button!==0))return;e.preventDefault();const p=point(e),eraser=mode==='erase'||e.button===5;

 for(const name of ['use','pen','highlight','erase'])get('ink-'+name).onclick=()=>useMode(name);
 if(TEXT_ENABLED){get('ink-text').onclick=()=>useMode('text');for(const [id,label] of [['ink-undo','Undo annotation on this slide (Ctrl+Z)'],['ink-redo','Redo annotation on this slide (Ctrl+Shift+Z)'],['ink-clear','Clear ink and text on this slide (undo available)'],['ink-more','Annotation backup, printing, and help'],['ink-color','Annotation color']]){get(id).title=label;get(id).setAttribute('aria-label',label);}}
 get('ink-undo').onclick=undoInk;get('ink-redo').onclick=redoInk;
 get('ink-clear').onclick=()=>{finishGesture();if(!strokes().length)return;remember(index,strokes());ink[index]=[];drawInk();saveNow();};
 get('ink-color').insertAdjacentHTML('beforebegin',[
  ['ink',[['Blue','#1565c0'],['Red','#c62828'],['Black','#111111']]],
  ['highlight',[['Yellow','#fdd835'],['Orange','#fb8c00']]]
 ].map(([palette,swatches])=>`<div class="ink-swatches" data-palette="${palette}" role="group" aria-label="${palette==='ink'?'Ink':'Highlighter'} color">`+swatches.map(([name,color])=>`<button type="button" class="ink-swatch" data-ink-color="${color}" title="${name} ${palette==='ink'?'ink':'highlighter'}" aria-label="${name} ${palette==='ink'?'ink':'highlighter'}" aria-pressed="false"><span style="background:${color}"></span></button>`).join('')+'</div>').join(''));
 get('ink-width').insertAdjacentHTML('beforebegin','<label class="ink-width-label" for="ink-width">Width</label>');

 function updateInkChoices(){
  const color=mode==='text'?textTools.color():(colorsForTool[mode]||colorsForTool.pen);
  toolbar.querySelectorAll('[data-palette]').forEach(group=>group.hidden=group.dataset.palette!==(mode==='highlight'?'highlight':'ink'));
  toolbar.querySelectorAll('[data-ink-color]').forEach(button=>button.setAttribute('aria-pressed',button.dataset.inkColor===color));
  get('ink-width').value=String(width);
 }
 function chooseInkColor(color){
  if(!['pen','highlight','text'].includes(mode))useMode('pen');

  get('ink-color').value=color;updateInkChoices();
 }

 get('ink-color').oninput=e=>chooseInkColor(e.target.value);
 get('ink-width').onchange=e=>{finishGesture();width=Number(e.target.value);useMode(mode==='highlight'?'highlight':'pen');};
 get('ink-menu').querySelector('#ink-close').onclick=()=>menu.close();
 const menuButton=get('ink-more');
 menuButton.onclick=()=>{finishGesture();get('ink-menu-message').textContent=saveFailed?'Browser saving is unavailable. Download a backup to keep your annotations.':`Backups include ink${TEXT_ENABLED?', text,':''} and diagram states for all slides.`;get('ink-menu-message').dataset.failed=saveFailed;menu.showModal();};
 get('ink-export').onclick=()=>{finishGesture();const blob=new Blob([JSON.stringify(payload(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`meeting-${DECK.meeting}-ink${TEXT_ENABLED?'-text':''}-backup.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);get('ink-menu-message').textContent='Annotation backup downloaded.';get('ink-menu-message').dataset.failed=false;};
 get('ink-load').onclick=()=>{fileInput.value='';fileInput.click();};
 fileInput.onchange=async()=>{const f=fileInput.files[0];if(!f)return;try{if(f.size>40000000)throw Error('The backup file is too large.');const loaded=validatePayload(JSON.parse(await f.text()));finishGesture();clearInterval(timer);timer=null;for(let i=0;i<DECK.slides.length;i++)remember(i,strokes(i));ink=loaded.slides;state=loaded.states;render();saveNow();get('ink-menu-message').textContent='Backup loaded. Previous ink is available with Undo on each slide.';get('ink-menu-message').dataset.failed=false;}catch(e){get('ink-menu-message').textContent='Could not load backup: '+e.message;get('ink-menu-message').dataset.failed=true;}};
 get('ink-print').onclick=()=>{finishGesture();menu.close();window.print();};
 // Run before the original keyboard listener, without changing its navigation keys.
 document.addEventListener('keydown',e=>{if(document.querySelector('dialog[open]')||e.target.closest('input,select,textarea')||e.altKey)return;const key=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&key==='z'){e.preventDefault();e.stopImmediatePropagation();e.shiftKey?redoInk():undoInk();return;}
  if((e.ctrlKey||e.metaKey)&&key==='y'){e.preventDefault();e.stopImmediatePropagation();redoInk();return;}
  if(e.ctrlKey||e.metaKey)return;const map={v:'use',p:'pen',h:'highlight',e:'erase',...(TEXT_ENABLED?{t:'text'}:{})};if(map[key]){e.preventDefault();e.stopImmediatePropagation();useMode(map[key]);}
 },true);
 function stopPlayback(){
  clearInterval(timer);timer=null;
  if(typeof pauseDeckAnimations==='function')pauseDeckAnimations();
  const button=stage.querySelector('[data-action="play"]');if(button)button.textContent='Play';

 // Pause without rerendering: an active pen stroke or text editor must stay put.
 document.addEventListener('pointerdown',e=>{if(e.target.closest('#ink-tools,#ink-layer,#ink-text-layer'))stopPlayback();},true);
 function updateLectureControls(){
  resets.hidden=index!==0;
  const s=DECK.slides[index];if(s.scene!=='route')return;
  const q=st(),controls=stage.querySelector('#slide .controls'),play=controls.querySelector('[data-action="play"]');
  play.textContent=timer?'Pause':'Play';
  controls.insertAdjacentHTML('beforeend','<label class="route-playback">Speed <select id="route-speed" aria-label="Route playback speed">'+[[1400,'Slow'],[700,'Normal'],[350,'Fast']].map(([n,label])=>`<option value="${n}" ${n===(q.routeDelay||700)?'selected':''}>${label}</option>`).join('')+'</select></label>'+`<label class="route-playback">Step <input id="route-progress" aria-label="Route step" type="range" min="0" max="${s.route.length-1}" value="${q.step}" aria-valuetext="${q.step} of ${s.route.length-1}"></label>`);

 const baseAction=action;
 action=function(a,target){
  if(a!=='play')return baseAction(a,target);
  if(timer){stopPlayback();return;}
  const q=st(),s=DECK.slides[index],at=index;
  if(q.step>=s.route.length-1)q.step=0;
  timer=setInterval(()=>{if(index!==at){stopPlayback();return;}q.step=Math.min(q.step+1,s.route.length-1);if(q.step===s.route.length-1)stopPlayback();render();},q.routeDelay||700);
