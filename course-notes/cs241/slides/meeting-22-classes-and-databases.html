<script>const DECK={"meeting": 22, "title": "Equivalence classes and databases", "acts": ["Calendar numbers", "Classes and representatives", "Partitions and relations", "Tables, selection, projection", "Joins and queries", "Synthesis"], "slides": [{"act": 0, "title": "Different numbers.<br>The same class.", "body": "<p>On U = {1,2,…,31}, relate two numbers when their difference is a multiple of seven.</p><div class=\"task\"><b>Try it first</b><p>Choose a number. Which other numbers belong with it?</p></div>", "scene": "calendar", "cover": true}, {"act": 0, "title": "Name the classes before revealing them", "body": "<div class=\"task\"><b>Try it first</b><p>List [1], [2], and [7]. Then compare [1] with [8]. Are they different sets?</p></div><p>The universe matters: today’s calendar example stops at 31.</p>", "scene": "calendar", "activity": "worksheet"}, {"act": 1, "title": "A class collects outgoing neighbors", "body": "<p>For a relation R on A, define</p><div class=\"equation\">[a] = {b ∈ A : a R b}</div><p>This is a <em>relation class</em>. For an equivalence relation, it is an equivalence class.</p><div class=\"task\"><b>Try it first</b><p>Read “a is a multiple of b” carefully. What belongs to [4]?</p></div>", "scene": "divisorClasses", "anchor": 4, "other": 6}, {"act": 1, "title": "General relation classes can overlap", "body": "<div class=\"task\"><b>Try it first</b><p>Compare [2] and [4] for “is a multiple of.” Are the classes equal? Are they disjoint?</p></div><p>The equal-or-disjoint conclusion requires an <em>equivalence relation</em>.</p>", "scene": "divisorClasses", "anchor": 2, "other": 4}, {"act": 1, "title": "A representative is a name, not a new set", "body": "<p>For congruence modulo seven, 1 ∼ 8.</p><div class=\"task\"><b>Try it first</b><p>Reveal both classes. What changes when the representative changes?</p></div><div class=\"equation\">[1] = [8]</div>", "scene": "calendar", "activity": "compare", "anchor": 1, "other": 8}, {"act": 1, "title": "Equivalent elements give equal classes", "body": "<p>Assume R is an equivalence relation and a R b.</p><div class=\"task\"><b>Try it first</b><p>Take x ∈ [a]. Why must x also belong to [b]?</p></div><p>Prove both containments to establish equality.</p>", "scene": "classProof", "kind": "equal"}, {"act": 1, "title": "A shared element forces equality", "body": "<div class=\"task\"><b>Try it first</b><p>Suppose x lies in both [a] and [b]. Use symmetry and transitivity to relate a and b.</p></div><p>Two equivalence classes can be equal or disjoint; partial overlap is impossible.</p>", "scene": "classProof", "kind": "overlap"}, {"act": 2, "title": "Keep one copy of each distinct class", "body": "<div class=\"task\"><b>Try it first</b><p>Color all the calendar classes. How many distinct blocks appear?</p></div><p>Every number belongs to its own class. Distinct classes do not overlap.</p>", "scene": "calendar", "activity": "partition"}, {"act": 2, "title": "What makes a partition?", "body": "<p>A <em>partition</em> of A consists of nonempty subsets whose union is A and whose distinct blocks are disjoint.</p><div class=\"task\"><b>Try it first</b><p>Test the proposed collection. If it fails, name the exact problem.</p></div>", "scene": "partitionCheck"}, {"act": 2, "title": "Build your own partition", "body": "<div class=\"task\"><b>Try it first</b><p>Put each element of {1,…,6} into exactly one block. Make exactly two nonempty blocks.</p></div><p>Click a number to move it to the next tray. Empty trays are unused; they are not blocks.</p>", "scene": "partitionEditor"}, {"act": 2, "title": "Same block defines a relation", "body": "<p>Use P = {{1,4}, {2,3,5}}. Define a ∼ b exactly when they share a block.</p><div class=\"task\"><b>Try it first</b><p>Which pairs involve 1? Which involve 2? Do the loops belong?</p></div>", "scene": "blockRelation"}, {"act": 2, "title": "Build every ordered pair", "body": "<div class=\"task\"><b>Try it first</b><p>Encode the same-block relation for {{1,4}, {2,3,5}}. Click matrix entries, then check your construction.</p></div><p>Both directions and the self-pairs matter.</p>", "scene": "blockRelation", "activity": "encode"}, {"act": 2, "title": "Why “same block” is equivalence", "body": "<div class=\"task\"><b>Try it first</b><p>Explain reflexivity, symmetry, and transitivity from the partition rules.</p></div><p>For transitivity, pay attention to the block containing the middle element.</p>", "scene": "blockRelation", "activity": "proof"}, {"act": 2, "title": "Two descriptions of the same structure", "body": "<p>Equivalence relation → distinct classes → same-block relation recovers the original relation.</p><p>Partition → same-block relation → classes recovers the original blocks.</p><div class=\"task\"><b>Try it first</b><p>Move an element. Watch the corresponding relation change.</p></div>", "scene": "correspondence"}, {"act": 2, "title": "From a finite calendar to all integers", "body": "<p>For any positive n, congruence modulo n partitions ℤ into n classes.</p><div class=\"equation\">ℤ = [0] ⊔ [1] ⊔ ⋯ ⊔ [n−1]</div><div class=\"task\"><b>Try it first</b><p>Change n. What stays true about each class?</p></div>", "scene": "integerClasses"}, {"act": 3, "title": "A table is a set of tuples", "body": "<p>A binary relation uses two coordinates. An n-ary relation uses n.</p><div class=\"equation\">R ⊆ X₁ × ⋯ × Xₙ</div><div class=\"task\"><b>Try it first</b><p>Click a row to read its ordered triple. Which sets supply its coordinates?</p></div>", "scene": "tuples"}, {"act": 3, "title": "Unique here does not mean guaranteed unique", "body": "<p>ID and Name are both distinct in the first sample. The database requires unique IDs but allows repeated names.</p><div class=\"task\"><b>Try it first</b><p>Add another Ada. Which attribute still has the promised guarantee?</p></div>", "scene": "keys"}, {"act": 3, "title": "Selection keeps rows that pass a test", "body": "<p>A <em>selection</em> filters tuples by a predicate. It keeps the same attributes.</p><div class=\"task\"><b>Try it first</b><p>Select Major = CS. Predict the surviving rows before applying the filter.</p></div>", "scene": "selection"}, {"act": 3, "title": "Projection keeps chosen coordinates", "body": "<p>A <em>projection</em> keeps selected attributes.</p><div class=\"task\"><b>Try it first</b><p>Project onto Major. How many distinct output tuples should there be?</p></div><p>In this course’s relation model, tuples form a set.</p>", "scene": "projection"}, {"act": 3, "title": "Two source rows can give one output tuple", "body": "<div class=\"task\"><b>Try it first</b><p>Reveal the projection onto Major. Click an output row to find all its contributors.</p></div><p>Discarded coordinates may be the only reason the original tuples were different.</p>", "scene": "projection", "activity": "duplicates"}, {"act": 3, "title": "Filter rows, then keep the names", "body": "<div class=\"task\"><b>Try it first</b><p>For STUDENT, first select Major = CS, then project onto Name. Write the unary relation.</p></div><p>Each operation produces another relation.</p>", "scene": "pipeline", "kind": "selectProject"}, {"act": 4, "title": "Match records through a stated condition", "body": "<p>STUDENT stores people. ENROLL stores course registrations.</p><div class=\"equation\">STUDENT.ID = ENROLL.StudentID</div><div class=\"task\"><b>Try it first</b><p>Click a row. Which rows in the other table match it?</p></div>", "scene": "join", "activity": "inspect"}, {"act": 4, "title": "A join tests pairs of rows", "body": "<p>A join selects compatible pairs from a Cartesian product.</p><div class=\"task\"><b>Try it first</b><p>There are 3 × 4 candidate row pairs. Which satisfy the ID equality?</p></div>", "scene": "joinGrid"}, {"act": 4, "title": "Construct the join one student at a time", "body": "<div class=\"task\"><b>Try it first</b><p>List all resulting (ID, Name, Course) tuples. Process each student and keep every matching enrollment.</p></div><p>A match produces a combined tuple; an absent match produces none.</p>", "scene": "join", "activity": "build"}, {"act": 4, "title": "One match is not the limit", "body": "<div class=\"task\"><b>Try it first</b><p>Inspect student 101. Why must two output tuples appear?</p></div><p>Every compatible pair contributes. Choosing only the first match loses information.</p>", "scene": "join", "activity": "multiple"}, {"act": 4, "title": "Unmatched rows do not survive this join", "body": "<div class=\"task\"><b>Try it first</b><p>Find one unmatched row in each input. Explain why neither can contribute an output tuple.</p></div><p>This is an inner join: only matching pairs are included.</p>", "scene": "join", "activity": "unmatched"}, {"act": 4, "title": "The matching attribute can be a room", "body": "<p>COURSE lists a course and room. ROOM lists a room and capacity.</p><div class=\"task\"><b>Try it first</b><p>Join on the room value. Write each matching room once in the combined tuple.</p></div>", "scene": "join", "kind": "rooms", "activity": "inspect"}, {"act": 4, "title": "Build a query from smaller operations", "body": "<div class=\"task\"><b>Try it first</b><p>Find the names and courses of CS majors: select STUDENT, join with ENROLL, then project onto Name and Course.</p></div><p>Follow the schema and the rows through each stage.</p>", "scene": "pipeline", "kind": "query"}, {"act": 5, "title": "Choose the operation and justify it", "body": "<div class=\"task\"><b>Try it first</b><p>Match each request to its operation. Also check the claim about equivalence classes.</p></div><p>Explain what changes: rows, coordinates, or combinations of tuples.</p>", "scene": "quiz"}, {"act": 5, "title": "Relations organize groups and records", "body": "<p>Equivalence classes turn consistent sameness into a partition.</p><p>Tables store tuples. Selection, projection, and joins build new relations.</p><p><em>Next:</em> Pascal’s triangle and counting.</p>", "scene": "closing"}]};'use strict';
const $=s=>document.querySelector(s),C={teal:'#087f6d',blue:'#286bab',purple:'#7451bc',gold:'#b47a0b',coral:'#c5473a',ink:'#172439',muted:'#526078'};
const FILLS=['#dcefe7','#e1eafa','#f0e3f7','#fff0d4','#fbe3e1','#dff0f3','#ecedcf'];
const STU=[[101,'Ada','CS'],[102,'Bo','Math'],[103,'Cy','CS']],ENROLL=[[101,241],[101,288],[103,241],[104,280]],ATTRS=['ID','Name','Major'];
const PARTITIONS=[[[1,3,5],[2,4,6]],[[1,2,3],[3,4],[5,6]],[[1,2],[3,4]],[[1,2,3],[4,5,6],[]],[[1,2,3],[4,5,6,7]]];
let state={},index=0,timer=null,serial=0;
const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const mod=(a,n)=>((a%n)+n)%n;
const range=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const setText=xs=>'{'+xs.join(', ')+'}';
const svg=(html,label,view='0 0 820 420')=>`<svg viewBox="${view}" role="group" aria-label="${esc(label)}">${html}</svg>`;
const txt=(x,y,t,size=23,color=C.ink,extra='')=>`<text x="${x}" y="${y}" font-size="${size}" fill="${color}" text-anchor="middle" dominant-baseline="central" ${extra}>${esc(t)}</text>`;
const btn=(label,action,extra='')=>`<button type="button" data-action="${action}" ${extra}>${label}</button>`;
const choose=(key,label,options,value)=>`<label>${label}<select data-setting="${key}" aria-label="${label}">${options.map(([v,t])=>`<option value="${v}" ${String(value)===String(v)?'selected':''}>${esc(t)}</option>`).join('')}</select></label>`;
function freshState(s){return {anchor:s.anchor||1,other:s.other||8,reveal:false,all:false,checked:false,step:0,candidate:0,bins:s.scene==='partitionEditor'?Array(6).fill(-1):[0,1,1,0,1],mask:0,reorder:false,focus:-1,n:5,repeat:false,column:0,filter:'CS',columns:4,source:'left',row:-1,output:-1,grid:0,answers:['?','?','?','?'],closing:0};}
function st(){return state[index]||(state[index]=freshState(DECK.slides[index]));}
function cleanDeckStates(raw){
 const out={},int=(v,a,b)=>Number.isInteger(v)&&v>=a&&v<=b;if(!raw||typeof raw!=='object'||Array.isArray(raw))return out;
 for(const [key,v] of Object.entries(raw)){const i=Number(key);if(!int(i,0,DECK.slides.length-1)||!v||typeof v!=='object'||Array.isArray(v))continue;const s=DECK.slides[i],q=freshState(s);
  for(const [k,a,b] of [['anchor',1,31],['other',1,31],['step',0,12],['candidate',0,4],['mask',0,33554431],['focus',-1,5],['n',2,7],['column',0,2],['columns',1,7],['row',-1,3],['output',-1,3],['grid',0,4095],['closing',0,1]])if(int(v[k],a,b))q[k]=v[k];
  for(const k of ['reveal','all','checked','reorder','repeat'])q[k]=v[k]===true;
  if(['CS','Math','All'].includes(v.filter))q.filter=v.filter;if(['left','right'].includes(v.source))q.source=v.source;
  const length=s.scene==='partitionEditor'?6:5;if(Array.isArray(v.bins)&&v.bins.length===length&&v.bins.every(x=>int(x,-1,2)))q.bins=[...v.bins];
  if(s.scene==='divisorClasses'){if(![2,4,6].includes(q.anchor))q.anchor=s.anchor||2;if(![2,4,6].includes(q.other))q.other=s.other||4;}
  if(Array.isArray(v.answers)&&v.answers.length===4&&v.answers.every(x=>['?','yes','no','selection','projection','join'].includes(x)))q.answers=[...v.answers];
  const maxStep=s.scene==='blockRelation'&&s.activity!=='proof'?5:s.scene==='pipeline'&&s.kind!=='query'?2:3;q.step=Math.min(q.step,maxStep);
  out[i]=q;
 }return out;
}
function relationClass(a,universe,predicate){return universe.filter(b=>predicate(a,b));}
function partitionReport(blocks,universe){
 const counts=new Map(universe.map(x=>[x,0])),outside=new Set();
 blocks.forEach(block=>new Set(block).forEach(x=>counts.has(x)?counts.set(x,counts.get(x)+1):outside.add(x)));
 const empty=blocks.flatMap((b,i)=>b.length?[]:[i]),missing=universe.filter(x=>counts.get(x)===0),repeated=universe.filter(x=>counts.get(x)>1);
 return {valid:!empty.length&&!missing.length&&!repeated.length&&!outside.size,empty,missing,repeated,outside:[...outside]};
}
function blocksFromBins(bins){return [...new Set(bins.filter(x=>x>=0))].sort().map(k=>bins.flatMap((b,i)=>b===k?[i+1]:[]));}
function sameBlockMask(bins){let mask=0;bins.forEach((a,i)=>bins.forEach((b,j)=>{if(a>=0&&a===b)mask|=1<<(i*bins.length+j);}));return mask;}
function classesFromMask(mask,n){const classes=[];for(let i=0;i<n;i++){const row=range(0,n-1).filter(j=>mask&(1<<(i*n+j))).map(j=>j+1);if(!classes.some(c=>JSON.stringify(c)===JSON.stringify(row)))classes.push(row);}return classes;}
function selectRows(rows,filter){return rows.filter(r=>filter==='All'||r[2]===filter);}
function projectRows(rows,columns){return [...new Map(rows.map(row=>{const tuple=columns.map(i=>row[i]);return [JSON.stringify(tuple),tuple];})).values()];}
function joinRows(left,right,leftKey=0,rightKey=0){const rows=left.flatMap(a=>right.filter(b=>a[leftKey]===b[rightKey]).map(b=>[...a,...b.filter((_,i)=>i!==rightKey)]));return [...new Map(rows.map(r=>[JSON.stringify(r),r])).values()];}
function panel(html,caption='',controls='',status=''){return html+`<div class="caption">${caption}</div><div class="controls">${controls}</div><div class="status" role="status" aria-live="polite">${status}</div>`;}
function calendar(s,q){
 const members=a=>relationClass(a,range(1,31),(x,y)=>mod(y-x,7)===0),first=members(q.anchor),second=members(q.other);let art='';
 for(let d=1;d<=31;d++){const x=142+((d-1)%7)*77,y=38+Math.floor((d-1)/7)*68,selected=d===q.anchor,belongs=first.includes(d),fill=q.all?FILLS[mod(d-1,7)]:q.reveal&&belongs?FILLS[0]:'#f3f6fa';
  art+=`<g class="calendar-day" role="button" tabindex="0" data-action="day" data-day="${d}" data-focus-key="day-${d}" aria-label="Select day ${d}"><rect x="${x}" y="${y}" width="65" height="57" rx="10" fill="${fill}" stroke="${selected?C.teal:'#bac8d9'}" stroke-width="${selected?3:1}"/>${txt(x+32.5,y+29,d,26)}</g>`;
 }
 let controls=choose('anchor','Representative',range(1,31).map(n=>[n,n]),q.anchor)+btn('Reveal class','reveal');
 if(s.activity==='compare')controls+=choose('other','Compare with',range(1,31).map(n=>[n,n]),q.other)+btn('Compare classes','check');
 if(s.activity==='partition'||s.cover)controls+=btn(q.all?'Hide all classes':'Color all classes','all');
 const caption=q.reveal?`[${q.anchor}] = ${setText(first)}`:'Click a number to reveal its class in U = {1,…,31}.';
 let status=q.all?'<strong>Seven distinct classes; every number appears in exactly one.</strong>':'';
 if(s.activity==='compare'&&q.checked)status=`[${q.other}] = ${setText(second)}. <strong>${mod(q.anchor-q.other,7)===0?'The two classes are equal.':'The two classes are disjoint.'}</strong>`;
 return panel(svg(art,'Calendar numbers 1 through 31'),caption,controls,status);
}
function divisorClasses(s,q){
 const members=a=>relationClass(a,range(1,6),(x,y)=>x%y===0),a=members(q.anchor),b=members(q.other),both=a.filter(x=>b.includes(x)),onlyA=a.filter(x=>!b.includes(x)),onlyB=b.filter(x=>!a.includes(x));
 const ellipse=(x,y,rx,ry,color,fill)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${fill}" fill-opacity=".7" stroke="${color}" stroke-width="2"/>`;
 let art='',regions;
 if(!q.reveal){art=ellipse(300,185,195,145,C.teal,FILLS[0])+ellipse(520,185,195,145,C.blue,FILLS[1])+txt(240,30,`[${q.anchor}]`,30,C.teal)+txt(580,30,`[${q.other}]`,30,C.blue)+txt(410,185,'?',38,C.muted);}
 else if(!onlyA.length&&!onlyB.length){art=ellipse(410,195,235,140,C.purple,FILLS[2])+txt(410,30,`[${q.anchor}] = [${q.other}]`,30,C.purple);regions=[[both,410,C.purple]];}
 else if(!onlyA.length||!onlyB.length){const aInside=!onlyA.length;art=ellipse(410,195,270,150,aInside?C.blue:C.teal,aInside?FILLS[1]:FILLS[0])+ellipse(325,195,130,115,aInside?C.teal:C.blue,aInside?FILLS[0]:FILLS[1])+txt(550,72,`[${aInside?q.other:q.anchor}]`,28,aInside?C.blue:C.teal)+txt(325,110,`[${aInside?q.anchor:q.other}]`,28,aInside?C.teal:C.blue);regions=[[both,325,C.purple],[aInside?onlyB:onlyA,555,aInside?C.blue:C.teal]];}
 else{art=ellipse(300,185,195,145,C.teal,FILLS[0])+ellipse(520,185,195,145,C.blue,FILLS[1])+txt(240,30,`[${q.anchor}]`,30,C.teal)+txt(580,30,`[${q.other}]`,30,C.blue);regions=[[onlyA,235,C.teal],[both,410,C.purple],[onlyB,585,C.blue]];}
 if(q.reveal){for(const [items,x,color] of regions)items.forEach((v,i)=>{const y=200+(i-(items.length-1)/2)*50;art+=`<circle cx="${x}" cy="${y}" r="22" fill="white" stroke="${color}" stroke-width="2"/>`+txt(x,y,v,25);});art+=txt(410,370,'Outside both classes: '+setText(range(1,6).filter(x=>!a.includes(x)&&!b.includes(x))),22,C.muted);}
 return panel(svg(art,'Two relation classes and their intersection'),q.reveal?`[${q.anchor}] = ${setText(a)}; [${q.other}] = ${setText(b)}`:'Here a R b means “a is a multiple of b.”',choose('anchor','First',[[2,2],[4,4],[6,6]],q.anchor)+choose('other','Second',[[2,2],[4,4],[6,6]],q.other)+btn('Reveal members','reveal'),q.reveal?`Intersection: ${setText(both)}. ${JSON.stringify(a)===JSON.stringify(b)?'These happen to be equal.':'Different classes can overlap in this general relation.'}`:'Compute the outgoing neighbors of each representative.');
}
function classProof(s,q){
 const points=[[145,105],[675,105],[410,290]],labels=['a','b','x'],id='proof-'+(++serial);let edges=s.kind==='equal'?[[0,1],[0,2]]:[[0,2],[1,2]];
 if(q.step>=1)edges.push(s.kind==='equal'?[1,0]:[2,1]);if(q.step>=2)edges.push(s.kind==='equal'?[1,2]:[0,1]);
 let art=`<defs><marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="${C.blue}"/></marker></defs>`;
 edges.forEach(([a,b],k)=>{const [x,y]=points[a],[u,v]=points[b],len=Math.hypot(u-x,v-y),dx=(u-x)/len,dy=(v-y)/len;art+=`<path d="M${x+dx*31},${y+dy*31} Q${(x+u)/2-dy*20},${(y+v)/2+dx*20} ${u-dx*31},${v-dy*31}" fill="none" stroke="${k>1?C.gold:C.blue}" stroke-width="4" marker-end="url(#${id})"/>`;});
 points.forEach(([x,y],i)=>art+=`<circle cx="${x}" cy="${y}" r="30" fill="white" stroke="${C.teal}" stroke-width="3"/>`+txt(x,y,labels[i],28));
 const lines=s.kind==='equal'?['Assume a R b and take x ∈ [a], so a R x.','Symmetry: a R b gives b R a.','Transitivity: b R a and a R x give b R x.','Thus [a] ⊆ [b]. Reverse the roles to get [b] ⊆ [a].']:['x ∈ [a] ∩ [b] means a R x and b R x.','Symmetry: b R x gives x R b.','Transitivity: a R x and x R b give a R b.','Equivalent representatives give [a] = [b].'];
 return panel('<div class="proof-visual">'+svg(art,'Relations used in the class proof','0 0 820 360')+`<div class="proof-line">${lines[Math.min(q.step,3)]}</div></div>`,'Only relations used in this argument are shown.',btn('Next reasoning step','step','data-max="3" '+(q.step===3?'disabled':''))+btn('Start proof again','reset'),q.step===3?'<strong>The argument used arbitrary elements, not just the picture.</strong>':'Identify which equivalence axiom permits the next arrow.');
}
function bucketDiagram(blocks,{checked=false,universe=range(1,6),interactive=false,bins=null}={}){
 const report=partitionReport(blocks.filter(b=>!interactive||b.length),universe),cols=blocks.length,w=760/cols;let art='';
 blocks.forEach((block,k)=>{const x=30+k*w;art+=`<rect x="${x}" y="58" width="${w-15}" height="245" rx="20" fill="${FILLS[k]}" stroke="${checked&&!block.length&&!interactive?C.coral:'#abc5bd'}" stroke-width="2"/>`+txt(x+(w-15)/2,88,interactive?`Tray ${'ABC'[k]}`:`Block ${k+1}`,23,C.muted);
  if(!block.length)art+=txt(x+(w-15)/2,190,interactive?'unused':'∅',interactive?23:40,C.muted);
  block.forEach((v,i)=>{const per=Math.min(3,Math.max(1,Math.floor((w-30)/58))),px=x+(w-15)/2+(i%per-(Math.min(per,block.length)-1)/2)*58,py=148+Math.floor(i/per)*68,bad=checked&&(report.repeated.includes(v)||report.outside.includes(v));art+=token(v,px,py,bad?C.coral:C.teal,interactive);});
 });
 const missing=universe.filter(v=>!blocks.some(b=>b.includes(v)));art+=txt(125,350,interactive?'Unplaced':'Outside the blocks',20,C.muted);
 missing.forEach((v,i)=>art+=token(v,265+i*65,350,checked?C.coral:C.muted,interactive));
 return svg(art,interactive?'Move elements among partition trays':'Proposed partition blocks');

 try{const raw=localStorage.getItem(storageKey);if(raw){const data=validatePayload(JSON.parse(raw));ink=data.slides;state=data.states;}}
 catch(e){loadedWarning='Browser storage could not be loaded. Use backups for this session.';saveFailed=true;}
 function payload(){return {version:TEXT_ENABLED?2:1,deck:fingerprint,title:`CS 241 · Meeting ${DECK.meeting} · ${DECK.title}`,savedAt:new Date().toISOString(),slides:ink,states:cleanStates(state)};}
 function status(message,failed=false){const e=get('ink-save-status');e.textContent=message;e.dataset.failed=failed;e.title=failed?'Automatic browser saving failed. Download an annotation backup.':`Ink${TEXT_ENABLED?', text,':''} and diagram states are saved in this browser, not in the HTML file.`;}
 function saveNow(){clearTimeout(saveTimer);try{localStorage.setItem(storageKey,JSON.stringify(payload()));saveFailed=false;status('Saved locally');}catch(e){saveFailed=true;status('Use backup',true);}}
 function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,180);}
 function elementForStroke(s){let el;
  if(s.points.length===1){el=document.createElementNS(NS,'circle');el.setAttribute('cx',s.points[0][0]);el.setAttribute('cy',s.points[0][1]);el.setAttribute('r',s.width/2);el.setAttribute('fill',s.color);}
  else{el=document.createElementNS(NS,'path');el.setAttribute('d',s.points.map((p,i)=>(i?'L':'M')+p.join(' ')).join(' '));el.setAttribute('fill','none');el.setAttribute('stroke',s.color);el.setAttribute('stroke-width',s.width);el.setAttribute('stroke-linecap','round');el.setAttribute('stroke-linejoin','round');}
  el.setAttribute('opacity',s.tool==='highlight'?'.27':'1');el.setAttribute('class','ink-stroke');return el;
 }
 function drawInk(){raf=0;layer.replaceChildren(...strokes().filter(s=>s.tool!=='text').map(elementForStroke));if(gesture?.stroke&&gesture.slide===index)layer.append(elementForStroke(gesture.stroke));textTools?.render();updateButtons();}
 function requestDraw(){if(!raf)raf=requestAnimationFrame(drawInk);}
 function updateButtons(){get('ink-undo').disabled=!(undo[index]?.length);get('ink-redo').disabled=!(redo[index]?.length);get('ink-clear').disabled=!strokes().length;get('resetAnnotations').disabled=!Object.values(ink).some(list=>list.length);}
 function remember(i,before){(undo[i]||(undo[i]=[])).push(before);if(undo[i].length>100)undo[i].shift();redo[i]=[];}
 function finishGesture(cancel=false){textTools?.finish();if(!gesture)return;const g=gesture;gesture=null;
  if(g.stroke&&!cancel){remember(g.slide,strokes(g.slide));ink[g.slide]=[...strokes(g.slide),g.stroke];}
  if(g.before){if(cancel)ink[g.slide]=g.before;else if(g.erased)remember(g.slide,g.before);}
  if(layer.hasPointerCapture(g.pointerId))layer.releasePointerCapture(g.pointerId);
  drawInk();saveNow();
 }
 function useMode(next){finishGesture();if(toolbar.contains(document.activeElement))document.activeElement.blur();mode=next;layer.classList.toggle('ink-enabled',mode!=='use');for(const name of ['use','pen','highlight','erase',...(TEXT_ENABLED?['text']:[])])get('ink-'+name).setAttribute('aria-pressed',name===mode);
  if(next!=='use')stopPlayback();
  get('ink-color').disabled=!['pen','highlight','text'].includes(mode);get('ink-color').value=mode==='text'?textTools.color():colorsForTool[mode]||colorsForTool.pen;textTools?.setMode(mode);updateInkChoices();
 }
 function undoInk(){finishGesture();if(!undo[index]?.length)return;(redo[index]||(redo[index]=[])).push(strokes());ink[index]=undo[index].pop();drawInk();saveNow();}
 function redoInk(){finishGesture();if(!redo[index]?.length)return;(undo[index]||(undo[index]=[])).push(strokes());ink[index]=redo[index].pop();drawInk();saveNow();}
 function point(e){const r=layer.getBoundingClientRect();return [Math.round(Math.max(0,Math.min(W,(e.clientX-r.left)*W/r.width))*10)/10,Math.round(Math.max(0,Math.min(H,(e.clientY-r.top)*H/r.height))*10)/10];}
 function pointSegment(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],len=dx*dx+dy*dy,t=len?Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/len)):0;return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy);}
 function segmentsDistance(a,b,c,d){const cross=(u,v,w)=>(v[0]-u[0])*(w[1]-u[1])-(v[1]-u[1])*(w[0]-u[0]);let x=cross(a,b,c),y=cross(a,b,d),z=cross(c,d,a),w=cross(c,d,b);
  if(((x>0&&y<0)||(x<0&&y>0))&&((z>0&&w<0)||(z<0&&w>0)))return 0;
  return Math.min(pointSegment(a,c,d),pointSegment(b,c,d),pointSegment(c,a,b),pointSegment(d,a,b));
 }
 function eraseBetween(a,b){const g=gesture;if(!g)return;const before=strokes(g.slide);ink[g.slide]=before.filter(s=>{if(s.tool==='text')return true;const radius=10+s.width/2;if(s.points.length===1)return pointSegment(s.points[0],a,b)>radius;for(let j=1;j<s.points.length;j++)if(segmentsDistance(a,b,s.points[j-1],s.points[j])<=radius)return false;return true;});if(ink[g.slide].length!==before.length)g.erased=true;requestDraw();}
 layer.addEventListener('pointerdown',e=>{if(mode==='use'||gesture||(e.pointerType==='mouse'&&e.button!==0))return;e.preventDefault();const p=point(e),eraser=mode==='erase'||e.button===5;
  if(mode==='text'){textTools.add(p);return;}
  gesture={slide:index,pointerId:e.pointerId,last:p};layer.setPointerCapture(e.pointerId);
  if(eraser){gesture.before=strokes();gesture.erased=false;eraseBetween(p,p);}else gesture.stroke={tool:mode,color:colorsForTool[mode],width:mode==='highlight'?width*6:width,points:[p]};requestDraw();
 });
 layer.addEventListener('pointermove',e=>{if(!gesture||e.pointerId!==gesture.pointerId)return;e.preventDefault();const samples=e.getCoalescedEvents?.()||[],events=samples.length?samples:[e];
  for(const sample of events){const p=point(sample);if(gesture.before)eraseBetween(gesture.last,p);else if(Math.hypot(p[0]-gesture.last[0],p[1]-gesture.last[1])>.5)gesture.stroke.points.push(p);gesture.last=p;}requestDraw();
 });
 layer.addEventListener('pointerup',e=>{if(!gesture||e.pointerId!==gesture.pointerId)return;e.preventDefault();const p=point(e);if(gesture.before)eraseBetween(gesture.last,p);else if(Math.hypot(p[0]-gesture.last[0],p[1]-gesture.last[1])>.5)gesture.stroke.points.push(p);finishGesture();});
 layer.addEventListener('pointercancel',e=>{if(gesture?.pointerId===e.pointerId)finishGesture(true);});
 layer.addEventListener('lostpointercapture',e=>{if(gesture?.pointerId===e.pointerId)finishGesture();});
 for(const name of ['use','pen','highlight','erase'])get('ink-'+name).onclick=()=>useMode(name);
 if(TEXT_ENABLED){get('ink-text').onclick=()=>useMode('text');for(const [id,label] of [['ink-undo','Undo annotation on this slide (Ctrl+Z)'],['ink-redo','Redo annotation on this slide (Ctrl+Shift+Z)'],['ink-clear','Clear ink and text on this slide (undo available)'],['ink-more','Annotation backup, printing, and help'],['ink-color','Annotation color']]){get(id).title=label;get(id).setAttribute('aria-label',label);}}
 get('ink-undo').onclick=undoInk;get('ink-redo').onclick=redoInk;
 get('ink-clear').onclick=()=>{finishGesture();if(!strokes().length)return;remember(index,strokes());ink[index]=[];drawInk();saveNow();};
 get('ink-color').insertAdjacentHTML('beforebegin',[
  ['ink',[['Blue','#1565c0'],['Red','#c62828'],['Black','#111111']]],
  ['highlight',[['Yellow','#fdd835'],['Orange','#fb8c00']]]
 ].map(([palette,swatches])=>`<div class="ink-swatches" data-palette="${palette}" role="group" aria-label="${palette==='ink'?'Ink':'Highlighter'} color">`+swatches.map(([name,color])=>`<button type="button" class="ink-swatch" data-ink-color="${color}" title="${name} ${palette==='ink'?'ink':'highlighter'}" aria-label="${name} ${palette==='ink'?'ink':'highlighter'}" aria-pressed="false"><span style="background:${color}"></span></button>`).join('')+'</div>').join(''));
 get('ink-width').insertAdjacentHTML('beforebegin','<label class="ink-width-label" for="ink-width">Width</label>');
 get('ink-width').innerHTML=[[3,'Thin'],[5,'Medium'],[8,'Thick']].map(([n,name])=>`<option value="${n}">${name}</option>`).join('');
 function updateInkChoices(){
  const color=mode==='text'?textTools.color():(colorsForTool[mode]||colorsForTool.pen);
  toolbar.querySelectorAll('[data-palette]').forEach(group=>group.hidden=group.dataset.palette!==(mode==='highlight'?'highlight':'ink'));
  toolbar.querySelectorAll('[data-ink-color]').forEach(button=>button.setAttribute('aria-pressed',button.dataset.inkColor===color));
  get('ink-width').value=String(width);
 }
 function chooseInkColor(color){
  if(!['pen','highlight','text'].includes(mode))useMode('pen');
  if(mode==='text')textTools.setColor(color);else colorsForTool[mode]=color;
  get('ink-color').value=color;updateInkChoices();
 }
 toolbar.querySelectorAll('[data-ink-color]').forEach(button=>button.onclick=()=>chooseInkColor(button.dataset.inkColor));
 get('ink-color').oninput=e=>chooseInkColor(e.target.value);
 get('ink-width').onchange=e=>{finishGesture();width=Number(e.target.value);useMode(mode==='highlight'?'highlight':'pen');};
 get('ink-menu').querySelector('#ink-close').onclick=()=>menu.close();
 const menuButton=get('ink-more');
 menuButton.onclick=()=>{finishGesture();get('ink-menu-message').textContent=saveFailed?'Browser saving is unavailable. Download a backup to keep your annotations.':`Backups include ink${TEXT_ENABLED?', text,':''} and diagram states for all slides.`;get('ink-menu-message').dataset.failed=saveFailed;menu.showModal();};
 get('ink-export').onclick=()=>{finishGesture();const blob=new Blob([JSON.stringify(payload(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`meeting-${DECK.meeting}-ink${TEXT_ENABLED?'-text':''}-backup.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);get('ink-menu-message').textContent='Annotation backup downloaded.';get('ink-menu-message').dataset.failed=false;};
 get('ink-load').onclick=()=>{fileInput.value='';fileInput.click();};
 fileInput.onchange=async()=>{const f=fileInput.files[0];if(!f)return;try{if(f.size>40000000)throw Error('The backup file is too large.');const loaded=validatePayload(JSON.parse(await f.text()));finishGesture();clearInterval(timer);timer=null;for(let i=0;i<DECK.slides.length;i++)remember(i,strokes(i));ink=loaded.slides;state=loaded.states;render();saveNow();get('ink-menu-message').textContent='Backup loaded. Previous ink is available with Undo on each slide.';get('ink-menu-message').dataset.failed=false;}catch(e){get('ink-menu-message').textContent='Could not load backup: '+e.message;get('ink-menu-message').dataset.failed=true;}};
 get('ink-print').onclick=()=>{finishGesture();menu.close();window.print();};
 // Run before the original keyboard listener, without changing its navigation keys.
 document.addEventListener('keydown',e=>{if(document.querySelector('dialog[open]')||e.target.closest('input,select,textarea')||e.altKey)return;const key=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&key==='z'){e.preventDefault();e.stopImmediatePropagation();e.shiftKey?redoInk():undoInk();return;}
  if((e.ctrlKey||e.metaKey)&&key==='y'){e.preventDefault();e.stopImmediatePropagation();redoInk();return;}
  if(e.ctrlKey||e.metaKey)return;const map={v:'use',p:'pen',h:'highlight',e:'erase',...(TEXT_ENABLED?{t:'text'}:{})};if(map[key]){e.preventDefault();e.stopImmediatePropagation();useMode(map[key]);}
 },true);
 function stopPlayback(){
  clearInterval(timer);timer=null;
  if(typeof pauseDeckAnimations==='function')pauseDeckAnimations();
  const button=stage.querySelector('[data-action="play"]');if(button)button.textContent='Play';
 }
 // Pause without rerendering: an active pen stroke or text editor must stay put.
 document.addEventListener('pointerdown',e=>{if(e.target.closest('#ink-tools,#ink-layer,#ink-text-layer'))stopPlayback();},true);
 function updateLectureControls(){
  resets.hidden=index!==0;
  const s=DECK.slides[index];if(s.scene!=='route')return;
  const q=st(),controls=stage.querySelector('#slide .controls'),play=controls.querySelector('[data-action="play"]');
  play.textContent=timer?'Pause':'Play';
  controls.insertAdjacentHTML('beforeend','<label class="route-playback">Speed <select id="route-speed" aria-label="Route playback speed">'+[[1400,'Slow'],[700,'Normal'],[350,'Fast']].map(([n,label])=>`<option value="${n}" ${n===(q.routeDelay||700)?'selected':''}>${label}</option>`).join('')+'</select></label>'+`<label class="route-playback">Step <input id="route-progress" aria-label="Route step" type="range" min="0" max="${s.route.length-1}" value="${q.step}" aria-valuetext="${q.step} of ${s.route.length-1}"></label>`);
 }
 const baseAction=action;
 action=function(a,target){
  if(a!=='play')return baseAction(a,target);
  if(timer){stopPlayback();return;}
  const q=st(),s=DECK.slides[index],at=index;
  if(q.step>=s.route.length-1)q.step=0;
  timer=setInterval(()=>{if(index!==at){stopPlayback();return;}q.step=Math.min(q.step+1,s.route.length-1);if(q.step===s.route.length-1)stopPlayback();render();},q.routeDelay||700);
  render();
 };
 document.addEventListener('change',e=>{
  if(!['route-speed','route-progress'].includes(e.target.id))return;
  stopPlayback();const q=st();if(e.target.id==='route-speed')q.routeDelay=Number(e.target.value);else q.step=Number(e.target.value);render();
 });
 const baseRender=render;
 render=function(){finishGesture();baseRender();updateLectureControls();document.title+=TEXT_ENABLED?' · Ink + text copy':' · Ink copy';drawInk();scheduleSave();};
 // The base print listener runs first; replace its reflowed pages with exact-layout pages.
 addEventListener('beforeprint',()=>{finishGesture();clearInterval(timer);timer=null;const old=index,container=get('print');container.replaceChildren();
  DECK.slides.forEach((s,i)=>{index=i;const page=document.createElement('section');page.className='ink-print-page';
   page.innerHTML=`<div class="brand"><b>CS 241</b>MEETING ${DECK.meeting}</div><article class="ink-print-slide ${s.cover?'cover':''}"><div class="eyebrow">${s.act===0?'Opening investigation':`Act ${s.act} / ${DECK.acts[s.act]}`}</div><h1>${s.title}</h1><div class="content"><div class="text">${s.body}</div><div class="visual">${renderScene(s,st())}</div></div></article><footer class="footer"><span>Meeting ${DECK.meeting} · ${DECK.title}</span><span>${i+1} / ${DECK.slides.length}</span></footer>`;
   const svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('class','ink-print-svg');strokes(i).filter(s=>s.tool!=='text').forEach(s=>svg.append(elementForStroke(s)));page.append(svg);textTools?.print(page,i);container.append(page);
  });index=old;
 });
 addEventListener('pagehide',()=>{finishGesture();saveNow();});
 addEventListener('blur',()=>finishGesture());
 get('restartLecture').onclick=()=>{useMode('use');stopPlayback();state={};go(0);saveNow();status('Lecture reset');get('restartLecture').blur();};
 get('resetAnnotations').onclick=()=>{useMode('use');stopPlayback();for(const [key,list] of Object.entries(ink))if(list.length)remember(Number(key),list);ink={};drawInk();saveNow();status('Notes reset');get('resetAnnotations').blur();};
 useMode('use');baseRender();updateLectureControls();document.title+=TEXT_ENABLED?' · Ink + text copy':' · Ink copy';drawInk();
 if(loadedWarning)status('Use backup',true);else status(Object.keys(ink).length?(TEXT_ENABLED?'Notes restored':'Ink restored'):'Ready');
})();
</script></body></html>
