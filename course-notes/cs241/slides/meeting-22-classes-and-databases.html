<script>const DECK={"meeting": 22, "title": "Equivalence classes and relational databases", "copyLabel": false, "annotationId": "m22-sections-v1", "acts": ["Congruence modulo 7", "Relation classes", "Equivalence relations and partitions", "Relations, selection, and projection", "Joins and relational queries", "Review"], "slides": [{"act": 0, "title": "Congruence modulo 7", "body": "<p>On U = {1,2,…,31}, relate two numbers when their difference is a multiple of seven.</p><div class=\"task\"><b>Exercise</b><p>Choose a ∈ U and find all b ∈ U such that 7 divides b − a.</p></div>", "scene": "calendar", "cover": true, "id": "m22-content-01"}, {"act": 0, "title": "Classes modulo 7", "body": "<div class=\"task\"><b>Exercise</b><p>Compute [1], [2], and [7]. Determine whether [1] = [8].</p></div><p>All classes are subsets of U = {1,2,…,31}.</p>", "scene": "calendar", "activity": "worksheet", "id": "m22-content-02"}, {"act": 1, "title": "Relation classes", "body": "<p>Define relation classes and prove when equivalence classes are equal or disjoint.</p>", "scene": "section", "id": "m22-section-1", "section": true}, {"act": 1, "title": "Relation classes", "body": "<p>For a relation R on A, define</p><div class=\"equation\">[a] = {b ∈ A : a R b}</div><p>This is a <em>relation class</em>. For an equivalence relation, it is an equivalence class.</p><div class=\"task\"><b>Exercise</b><p>On A = {1,…,6}, let a R b mean that a is a multiple of b. Compute [4].</p></div>", "scene": "divisorClasses", "anchor": 4, "other": 6, "id": "m22-content-03"}, {"act": 1, "title": "Overlapping relation classes", "body": "<div class=\"task\"><b>Exercise</b><p>For the relation “is a multiple of” on {1,…,6}, compute [2] ∩ [4]. Are [2] and [4] equal?</p></div><p>Relation classes may intersect without being equal. For an <em>equivalence relation</em>, two classes are equal or disjoint.</p>", "scene": "divisorClasses", "anchor": 2, "other": 4, "id": "m22-content-04"}, {"act": 1, "title": "Class representatives", "body": "<p>For congruence modulo seven, 1 ∼ 8.</p><div class=\"task\"><b>Exercise</b><p>Compare the sets represented by 1 and 8. Then replace 8 by 2 and compare again.</p></div><div class=\"equation\">[1] = [8]</div>", "scene": "calendar", "activity": "compare", "anchor": 1, "other": 8, "id": "m22-content-05"}, {"act": 1, "title": "Equivalent elements and equal classes", "body": "<p>Assume R is an equivalence relation and a R b.</p><div class=\"task\"><b>Exercise</b><p>Take x ∈ [a] and prove x ∈ [b]. State where symmetry and transitivity are used.</p></div><p>Prove the reverse containment to conclude <span style=\"white-space:nowrap\">[a] = [b]</span>.</p>", "scene": "classProof", "kind": "equal", "id": "m22-content-06"}, {"act": 1, "title": "Equivalence classes: equal or disjoint", "body": "<p>Let R be an equivalence relation. Its classes are either equal or disjoint.</p><div class=\"task\"><b>Exercise</b><p>Suppose x ∈ [a] ∩ [b]. Prove a R b using symmetry and transitivity, then conclude <span style=\"white-space:nowrap\">[a] = [b]</span>.</p></div>", "scene": "classProof", "kind": "overlap", "id": "m22-content-07"}, {"act": 2, "title": "Equivalence relations and partitions", "body": "<p>Establish the correspondence between equivalence relations and partitions.</p>", "scene": "section", "id": "m22-section-2", "section": true}, {"act": 2, "title": "Classes as partition blocks", "body": "<div class=\"task\"><b>Exercise</b><p>List the distinct classes modulo 7 in U = {1,…,31}. Verify that they cover U and are pairwise disjoint.</p></div><p>Reflexivity gives a ∈ [a]. Distinct equivalence classes are disjoint.</p>", "scene": "calendar", "activity": "partition", "id": "m22-content-08"}, {"act": 2, "title": "Partitions", "body": "<p>A <em>partition</em> of A consists of nonempty subsets whose union is A and whose distinct blocks are disjoint.</p><div class=\"task\"><b>Exercise</b><p>Determine whether each collection is a partition. Identify any failure of nonemptiness, containment in A, coverage, or disjointness.</p></div>", "scene": "partitionCheck", "id": "m22-content-09"}, {"act": 2, "title": "Constructing a partition", "body": "<div class=\"task\"><b>Exercise</b><p>Construct a partition of {1,…,6} into exactly two nonempty blocks.</p></div><p>For each element, click its destination: Block A, B, or C. Use exactly two blocks; leave the third unused.</p>", "scene": "partitionEditor", "id": "m22-content-10"}, {"act": 2, "title": "Relation induced by a partition", "body": "<p>Let P = {{1,4}, {2,3,5}}. Define a ∼ b if a and b belong to the same block of P.</p><div class=\"task\"><b>Exercise</b><p>List all pairs (1,b) and (2,b) in the relation. Determine which pairs (a,a) belong.</p></div>", "scene": "blockRelation", "id": "m22-content-11"}, {"act": 2, "title": "Matrix of the induced relation", "body": "<div class=\"task\"><b>Exercise</b><p>Construct the matrix of the relation induced by {{1,4}, {2,3,5}}. Set entry (a,b) to 1 exactly when a and b share a block.</p></div><p>Include both ordered directions and every diagonal pair.</p>", "scene": "blockRelation", "activity": "encode", "id": "m22-content-12"}, {"act": 2, "title": "Proof of equivalence", "body": "<div class=\"task\"><b>Exercise</b><p>Prove that the relation induced by any partition is reflexive, symmetric, and transitive.</p></div><p>For transitivity, use the uniqueness of the block containing the middle element.</p>", "scene": "blockRelation", "activity": "proof", "id": "m22-content-13"}, {"act": 2, "title": "Equivalence relations and partitions", "body": "<p>Taking the distinct classes of an equivalence relation produces a partition. The induced same-block relation is the original relation.</p><p>Conversely, the classes of a relation induced by a partition are exactly its blocks.</p><div class=\"task\"><b>Exercise</b><p>Move an element between blocks and identify every ordered pair that changes.</p></div>", "scene": "correspondence", "id": "m22-content-14"}, {"act": 2, "title": "Congruence classes on the integers", "body": "<p>For every positive integer n, congruence modulo n partitions ℤ into exactly n classes.</p><div class=\"equation\">ℤ = [0] ⊔ [1] ⊔ ⋯ ⊔ [n−1]</div><div class=\"task\"><b>Exercise</b><p>Change n. Explain why each integer belongs to exactly one of these classes.</p></div>", "scene": "integerClasses", "id": "m22-content-15"}, {"act": 3, "title": "Relations, selection, and projection", "body": "<p>Represent data as relations and apply selection and projection.</p>", "scene": "section", "id": "m22-section-3", "section": true}, {"act": 3, "title": "n-ary relations", "body": "<p>An <em>n-ary relation</em> on X₁,…,Xₙ is a set of ordered n-tuples:</p><div class=\"equation\">R ⊆ X₁ × ⋯ × Xₙ</div><div class=\"task\"><b>Exercise</b><p>Identify the coordinate sets for STUDENT. State its arity and its number of tuples.</p></div>", "scene": "tuples", "id": "m22-content-16"}, {"act": 3, "title": "Keys and uniqueness constraints", "body": "<p>A key uniquely identifies each tuple in every allowed instance. Here ID is required to be unique; Name is not.</p><div class=\"task\"><b>Exercise</b><p>Add another student named Ada. Which uniqueness constraint remains satisfied?</p></div>", "scene": "keys", "id": "m22-content-17"}, {"act": 3, "title": "Selection", "body": "<p>A <em>selection</em> returns the tuples satisfying a predicate, with their attributes unchanged.</p><div class=\"task\"><b>Exercise</b><p>Select Major = CS. List the resulting tuples before applying the filter.</p></div>", "scene": "selection", "id": "m22-content-18"}, {"act": 3, "title": "Projection", "body": "<p>A <em>projection</em> retains specified coordinates and removes duplicate resulting tuples.</p><div class=\"task\"><b>Exercise</b><p>Project STUDENT onto Major. List the distinct output tuples.</p></div><p>Relations are sets of tuples.</p>", "scene": "projection", "id": "m22-content-19"}, {"act": 3, "title": "Duplicate elimination in projection", "body": "<div class=\"task\"><b>Exercise</b><p>Project onto Major. For each output tuple, identify every input tuple that produces it.</p></div><p>Distinct input tuples may agree on every retained coordinate.</p>", "scene": "projection", "activity": "duplicates", "id": "m22-content-20"}, {"act": 3, "title": "Selection followed by projection", "body": "<div class=\"task\"><b>Exercise</b><p>For STUDENT, first select Major = CS, then project onto Name. Write the unary relation.</p></div><p>Each operation produces another relation.</p>", "scene": "pipeline", "kind": "selectProject", "id": "m22-content-21"}, {"act": 4, "title": "Joins and relational queries", "body": "<p>Construct joins by matching tuples and compose relational operations.</p>", "scene": "section", "id": "m22-section-4", "section": true}, {"act": 4, "title": "Join condition", "body": "<p>Join STUDENT and ENROLL using the condition</p><div class=\"equation\">STUDENT.ID = ENROLL.StudentID</div><div class=\"task\"><b>Exercise</b><p>For each input tuple, identify all matching tuples in the other relation.</p></div>", "scene": "join", "activity": "inspect", "id": "m22-content-22"}, {"act": 4, "title": "Joins as restricted Cartesian products", "body": "<p>Restrict STUDENT × ENROLL to pairs satisfying the ID equality. Then retain the matching ID once.</p><div class=\"task\"><b>Exercise</b><p>Among the 3 × 4 candidate pairs, identify all pairs satisfying the join condition.</p></div>", "scene": "joinGrid", "id": "m22-content-23"}, {"act": 4, "title": "Constructing a join result", "body": "<div class=\"task\"><b>Exercise</b><p>List every resulting (ID, Name, Course) tuple. Include every matching enrollment for each student.</p></div><p>Each matching pair produces a combined tuple with the common ID written once.</p>", "scene": "join", "activity": "build", "id": "m22-content-24"}, {"act": 4, "title": "Multiple matches", "body": "<div class=\"task\"><b>Exercise</b><p>List all enrollments matching student 101. Explain why each produces a distinct output tuple.</p></div><p>The join includes every pair satisfying the condition.</p>", "scene": "join", "activity": "multiple", "id": "m22-content-25"}, {"act": 4, "title": "Unmatched rows", "body": "<div class=\"task\"><b>Exercise</b><p>Find an unmatched tuple in each input relation. Explain why neither contributes to the result.</p></div><p>An inner join contains only pairs satisfying the join condition.</p>", "scene": "join", "activity": "unmatched", "id": "m22-content-26"}, {"act": 4, "title": "Joining on room identifiers", "body": "<p>COURSE has attributes Course and Room. ROOM has attributes Room and Capacity.</p><div class=\"task\"><b>Exercise</b><p>Join on equality of the Room attributes. List the resulting (Course, Room, Capacity) tuples.</p></div>", "scene": "join", "kind": "rooms", "activity": "inspect", "id": "m22-content-27"}, {"act": 4, "title": "Composing relational operations", "body": "<div class=\"task\"><b>Exercise</b><p>Select the CS majors from STUDENT, join with ENROLL on ID equality, and project onto Name and Course.</p></div><p>State the attributes and tuples of each intermediate relation.</p>", "scene": "pipeline", "kind": "query", "id": "m22-content-28"}, {"act": 5, "title": "Review", "body": "<p>Review equivalence classes, partitions, and relational operations.</p>", "scene": "section", "id": "m22-section-5", "section": true}, {"act": 5, "title": "Review exercises", "body": "<div class=\"task\"><b>Exercise</b><p>Evaluate the statement about equivalence classes and select the operation for each query.</p></div><p>Justify each choice from the relevant definition.</p>", "scene": "quiz", "id": "m22-content-29"}, {"act": 5, "title": "Summary: classes and relational operations", "body": "<p>The distinct classes of an equivalence relation form a partition, and each partition induces an equivalence relation.</p><p>Selection restricts tuples, projection retains coordinates, and a join restricts pairs from a Cartesian product.</p><p><em>Next:</em> Pascal’s triangle and counting.</p>", "scene": "closing", "id": "m22-content-30"}], "annotationMigrations": [{"deck": "m22-bb6b774f", "slideMap": [0, 1, 3, 4, 5, 6, 7, 9, 10, 11, 12, 13, 14, 15, 16, 18, 19, 20, 21, 22, 23, 25, 26, 27, 28, 29, 30, 31, 33, 34]}]};'use strict';
const $=s=>document.querySelector(s),C={teal:'#087f6d',blue:'#286bab',purple:'#7451bc',gold:'#b47a0b',coral:'#c5473a',ink:'#172439',muted:'#526078'};

function freshState(s){return {anchor:s.anchor||1,other:s.other||8,reveal:false,all:false,checked:false,step:0,candidate:0,bins:s.scene==='partitionEditor'?Array(6).fill(-1):[0,1,1,0,1],mask:0,reorder:false,focus:-1,n:5,repeat:false,column:0,filter:'CS',columns:4,source:'left',row:-1,output:-1,grid:0,answers:['?','?','?','?'],closing:0};}

 for(const [key,v] of Object.entries(raw)){const i=Number(key);if(!int(i,0,DECK.slides.length-1)||!v||typeof v!=='object'||Array.isArray(v))continue;const s=DECK.slides[i],q=freshState(s);

 }return out;

function relationClass(a,universe,predicate){return universe.filter(b=>predicate(a,b));}
function partitionReport(blocks,universe){
 const counts=new Map(universe.map(x=>[x,0])),outside=new Set();
 blocks.forEach(block=>new Set(block).forEach(x=>counts.has(x)?counts.set(x,counts.get(x)+1):outside.add(x)));
 const empty=blocks.flatMap((b,i)=>b.length?[]:[i]),missing=universe.filter(x=>counts.get(x)===0),repeated=universe.filter(x=>counts.get(x)>1);
 return {valid:!empty.length&&!missing.length&&!repeated.length&&!outside.size,empty,missing,repeated,outside:[...outside]};
}
function blocksFromBins(bins){return [...new Set(bins.filter(x=>x>=0))].sort().map(k=>bins.flatMap((b,i)=>b===k?[i+1]:[]));}
function sameBlockMask(bins){let mask=0;bins.forEach((a,i)=>bins.forEach((b,j)=>{if(a>=0&&a===b)mask|=1<<(i*bins.length+j);}));return mask;}
function classesFromMask(mask,n){const classes=[];for(let i=0;i<n;i++){const row=range(0,n-1).filter(j=>mask&(1<<(i*n+j))).map(j=>j+1);if(!classes.some(c=>JSON.stringify(c)===JSON.stringify(row)))classes.push(row);}return classes;}
function selectRows(rows,filter){return rows.filter(r=>filter==='All'||r[2]===filter);}
function projectRows(rows,columns){return [...new Map(rows.map(row=>{const tuple=columns.map(i=>row[i]);return [JSON.stringify(tuple),tuple];})).values()];}
function joinRows(left,right,leftKey=0,rightKey=0){const rows=left.flatMap(a=>right.filter(b=>a[leftKey]===b[rightKey]).map(b=>[...a,...b.filter((_,i)=>i!==rightKey)]));return [...new Map(rows.map(r=>[JSON.stringify(r),r])).values()];}
function panel(html,caption='',controls='',status=''){return html+`<div class="caption">${caption}</div><div class="controls">${controls}</div><div class="status" role="status" aria-live="polite">${status}</div>`;}
function calendar(s,q){
 const members=a=>relationClass(a,range(1,31),(x,y)=>mod(y-x,7)===0),first=members(q.anchor),second=members(q.other),compare=s.activity==='compare',compared=compare&&q.checked,equal=mod(q.anchor-q.other,7)===0,sharedId='calendar-shared-'+(++serial);
 let art=compared&&equal?`<defs><linearGradient id="${sharedId}"><stop offset="50%" stop-color="${FILLS[0]}"/><stop offset="50%" stop-color="${FILLS[1]}"/></linearGradient></defs>`:'';
 for(let d=1;d<=31;d++){const x=142+((d-1)%7)*77,y=38+Math.floor((d-1)/7)*68,selected=d===q.anchor,belongs=first.includes(d),inFirst=(q.reveal||compared)&&belongs,inSecond=compared&&second.includes(d),membership=inFirst&&inSecond?'both':inFirst?'first':inSecond?'second':'neither';
  const fill=compared?(inFirst&&inSecond?`url(#${sharedId})`:inFirst?FILLS[0]:inSecond?FILLS[1]:'#f3f6fa'):q.all&&!compare?FILLS[mod(d-1,7)]:inFirst?FILLS[0]:'#f3f6fa',stroke=compared?(inFirst?C.teal:inSecond?C.blue:'#bac8d9'):selected?C.teal:'#bac8d9';
  const membershipLabel=compare?(inFirst&&inSecond?`; in both [${q.anchor}] and [${q.other}]`:inFirst?`; in [${q.anchor}]`:inSecond?`; in [${q.other}]`:compared?'; in neither selected class':''):'';
  art+=`<g class="calendar-day" role="button" tabindex="0" data-action="day" data-day="${d}" data-focus-key="day-${d}" data-membership="${membership}" aria-label="Select number ${d}${membershipLabel}"><rect x="${x}" y="${y}" width="65" height="57" rx="10" fill="${fill}" stroke="${stroke}" stroke-width="${selected||compared&&d===q.other?3:compared&&(inFirst||inSecond)?2:1}"/>${txt(x+32.5,y+29,d,26)}</g>`;
 }
 let controls=choose('anchor','Representative',range(1,31).map(n=>[n,n]),q.anchor)+btn('Reveal class','reveal');
 if(compare)controls+=choose('other','Compare with',range(1,31).map(n=>[n,n]),q.other)+btn('Compare classes','check');
 if(s.activity==='partition'||s.cover)controls+=btn(q.all?'Hide all classes':'Color all classes','all');
 const classLabel=(a,values,color)=>`<span class="class-readout ${color}"><span class="class-swatch" aria-hidden="true"></span>[${a}] = ${setText(values)}</span>`;
 const caption=compare?(compared?`<div class="class-comparison">${classLabel(q.anchor,first,'first')}${classLabel(q.other,second,'second')}</div>`:q.reveal?`<div class="class-comparison">${classLabel(q.anchor,first,'first')}</div>`:'Choose two representatives and compare their classes in U = {1,…,31}.'):q.reveal?`[${q.anchor}] = ${setText(first)}`:'Click a number to reveal its class in U = {1,…,31}.';

 if(compared)status=equal?`<strong>[${q.anchor}] = [${q.other}]. The two classes are equal.</strong><br>Both colors mark every member of the same class.`:`<strong>[${q.anchor}] ∩ [${q.other}] = ∅. The two classes are disjoint.</strong>`;

}
function divisorClasses(s,q){
 const members=a=>relationClass(a,range(1,6),(x,y)=>x%y===0),a=members(q.anchor),b=members(q.other),both=a.filter(x=>b.includes(x)),onlyA=a.filter(x=>!b.includes(x)),onlyB=b.filter(x=>!a.includes(x));

  controls.insertAdjacentHTML('beforeend','<label class="route-playback">Speed <select id="route-speed" aria-label="Route playback speed">'+[[1400,'Slow'],[700,'Normal'],[350,'Fast']].map(([n,label])=>`<option value="${n}" ${n===(q.routeDelay||700)?'selected':''}>${label}</option>`).join('')+'</select></label>'+`<label class="route-playback">Step <input id="route-progress" aria-label="Route step" type="range" min="0" max="${s.route.length-1}" value="${q.step}" aria-valuetext="${q.step} of ${s.route.length-1}"></label>`);
 }
 const baseAction=action;
 action=function(a,target){
  if(a!=='play')return baseAction(a,target);
  if(timer){stopPlayback();return;}
  const q=st(),s=DECK.slides[index],at=index;
  if(q.step>=s.route.length-1)q.step=0;
  timer=setInterval(()=>{if(index!==at){stopPlayback();return;}q.step=Math.min(q.step+1,s.route.length-1);if(q.step===s.route.length-1)stopPlayback();render();},q.routeDelay||700);
  render();
 };
 document.addEventListener('change',e=>{
  if(!['route-speed','route-progress'].includes(e.target.id))return;
  stopPlayback();const q=st();if(e.target.id==='route-speed')q.routeDelay=Number(e.target.value);else q.step=Number(e.target.value);render();
 });
 const baseRender=render;
 render=function(){finishGesture();baseRender();updateLectureControls();if(DECK.copyLabel!==false)document.title+=TEXT_ENABLED?' · Ink + text copy':' · Ink copy';drawInk();scheduleSave();};
 // The base print listener runs first; replace its reflowed pages with exact-layout pages.
 addEventListener('beforeprint',()=>{finishGesture();clearInterval(timer);timer=null;const old=index,container=get('print');container.replaceChildren();
  DECK.slides.forEach((s,i)=>{index=i;const page=document.createElement('section');page.className='ink-print-page';
   const customLayout=typeof slideClass==='function';
   const markup=customLayout?slideContent(s,st()):`<div class="eyebrow">${s.act===0?'Opening investigation':`Act ${s.act} / ${DECK.acts[s.act]}`}</div><h1>${s.title}</h1><div class="content"><div class="text">${s.body}</div><div class="visual">${renderScene(s,st())}</div></div>`;
   page.innerHTML=`<div class="brand"><b>CS 241</b>MEETING ${DECK.meeting}</div><article class="ink-print-slide ${customLayout?slideClass(s):(s.cover?'cover':'')}">${markup}</article><footer class="footer"><span>Meeting ${DECK.meeting} · ${DECK.title}</span><span>${i+1} / ${DECK.slides.length}</span></footer>`;
   const svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('class','ink-print-svg');strokes(i).filter(s=>s.tool!=='text').forEach(s=>svg.append(elementForStroke(s)));page.append(svg);textTools?.print(page,i);container.append(page);
  });index=old;
 });
 addEventListener('pagehide',()=>{finishGesture();saveNow();});
 addEventListener('blur',()=>finishGesture());
 get('restartLecture').onclick=()=>{useMode('use');stopPlayback();state={};go(0);saveNow();status('Lecture reset');get('restartLecture').blur();};
 get('resetAnnotations').onclick=()=>{useMode('use');stopPlayback();for(const [key,list] of Object.entries(ink))if(list.length)remember(Number(key),list);ink={};drawInk();saveNow();status('Notes reset');get('resetAnnotations').blur();};
 useMode('use');baseRender();updateLectureControls();if(DECK.copyLabel!==false)document.title+=TEXT_ENABLED?' · Ink + text copy':' · Ink copy';drawInk();
 if(loadedWarning)status('Use backup',true);else status(Object.keys(ink).length?(TEXT_ENABLED?'Notes restored':'Ink restored'):'Ready');
})();
