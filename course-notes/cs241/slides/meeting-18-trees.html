*{box-sizing:border-box}body{margin:0;background:#ffffff;color:var(--ink);font-family:'Aptos','Segoe UI',sans-serif;overflow:hidden}button,select{font:inherit}button,a,select{-webkit-tap-highlight-color:transparent}button{cursor:pointer;background:transparent;color:var(--ink);border:1px solid #b5c0cf;border-radius:8px;padding:10px 17px;font-size:19px}button:hover{background:#edf2f7}button:focus-visible,a:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold);outline-offset:5px}button:disabled{opacity:.35;cursor:default}a{color:var(--mint)}#stage{width:1600px;height:900px;position:absolute;left:50%;top:50%;transform-origin:center;background:var(--bg);overflow:hidden}.brand{position:absolute;top:35px;left:64px;font-size:20px;letter-spacing:.14em;color:var(--muted)}.brand b{color:var(--mint);margin-right:22px}.topnav{position:absolute;right:64px;top:28px;display:flex;gap:12px;align-items:center}select{background:var(--bg);color:var(--ink);border:1px solid #b5c0cf;border-radius:8px;padding:10px;font-size:18px;max-width:260px}#slide{position:absolute;inset:104px 64px 94px}.eyebrow{font-size:18px;color:var(--mint);text-transform:uppercase;letter-spacing:.17em;margin-bottom:12px}h1{font-size:60px;line-height:1.08;letter-spacing:-.035em;margin:0 0 30px;font-weight:700;max-width:1420px}.content{display:grid;grid-template-columns:43% 57%;gap:0;height:480px}.text{padding-right:42px;align-self:center;font-size:27px;line-height:1.42}.text p{margin:0 0 24px}.text p:last-child{margin-bottom:0}em{font-style:normal;color:var(--mint);font-weight:650}.equation{font-family:'Cambria Math','Cambria',serif;font-size:37px;line-height:1.4;margin:17px 0;color:var(--gold)}.task{border-left:4px solid var(--gold);padding:3px 0 3px 23px}.task b{font-size:17px;text-transform:uppercase;letter-spacing:.15em;color:var(--gold);display:block;margin-bottom:12px}.task+p{margin-top:22px;color:var(--muted)}ul{margin:0;padding-left:26px}li{margin-bottom:18px}.rules strong <script>const DECK={"title": "Trees", "subtitle": "Unique paths · induction · recursive structure", "acts": ["The connection puzzle", "Trees and unique paths", "Leaves and induction", "Spanning and rooted trees", "Traversals and applications"], "slides": [{"act": 0, "title": "How few edges<br>can keep us connected?", "body": "<p>Keep every vertex. Remove as many edges as possible without disconnecting the graph.</p><p>Which edges are essential?</p>", "scene": "graph", "graph": "investigation", "cover": true}, {"act": 0, "title": "Try the two construction problems", "body": "<div class=\"task\"><b>Investigate</b><p>First keep as few edges as possible while connecting every vertex. Then start empty and add as many edges as possible without making a cycle.</p></div><p>Compare your edge counts. State a conjecture.</p>", "scene": "treeEditor"}, {"act": 1, "title": "Which drawings are trees?", "body": "<p>A <em>tree</em> is connected and has no cycles. A <em>forest</em> has no cycles, but may be disconnected.</p><div class=\"task\"><b>Investigate</b><p>Test each drawing against both conditions.</p></div><p>Here graphs are finite, simple, undirected, and nonempty.</p>", "scene": "treeExamples"}, {"act": 1, "title": "How many paths join two vertices?", "body": "<div class=\"task\"><b>Investigate</b><p>Find a path from c to e. Can there be another path with no repeated vertices?</p></div><p>Now add the extra edge. What changes?</p>", "scene": "uniqueExplore"}, {"act": 1, "title": "Two different paths create a cycle", "body": "<p>Two paths may share a beginning and an ending.</p><p>Find where they first separate, then where they next meet. Their two different segments form a cycle.</p>", "scene": "pathCycle"}, {"act": 1, "title": "Trees have exactly one path", "body": "<p><em>Tree ⇒ unique paths.</em> Connectedness supplies a path. A second path would create a cycle.</p><p><em>Unique paths ⇒ tree.</em> Existence gives connectedness. A cycle would give two paths between vertices on it.</p><div class=\"equation\">tree ⇔ exactly one path per pair</div>", "scene": "pathCycle", "complete": true}, {"act": 1, "title": "What if one tree edge disappears?", "body": "<div class=\"task\"><b>Investigate</b><p>Prove that deleting an edge uv from a tree disconnects it. If u and v were still connected, what would that imply about the original tree?</p></div>", "scene": "treeCut"}, {"act": 2, "title": "Count vertices and edges", "body": "<div class=\"task\"><b>Investigate</b><p>Count n and e in these trees. What relationship do you suspect?</p></div><p>Include the smallest tree. A few examples suggest a formula; they do not prove it.</p>", "scene": "treeCounts"}, {"act": 2, "title": "Where can we safely shorten a tree?", "body": "<p>A <em>leaf</em> is a vertex of degree 1.</p><div class=\"task\"><b>Investigate</b><p>Choose a longest path in a tree with at least two vertices. Could one endpoint have another neighbor?</p></div>", "scene": "longestPath"}, {"act": 2, "title": "At least two leaves", "body": "<p>At either endpoint of a longest path, an extra neighbor would create a cycle or extend the path.</p><p>Both are impossible. Each endpoint therefore has degree 1.</p><div class=\"equation\">n ≥ 2 ⇒ at least two leaves</div>", "scene": "longestPath", "conclusion": true}, {"act": 2, "title": "Delete one leaf, keep a tree", "body": "<p>Delete a leaf and its only incident edge.</p><p>No cycle can appear. Paths between remaining vertices survive: a leaf cannot lie inside such a path.</p><div class=\"equation\">(n,e) → (n−1,e−1)</div>", "scene": "leafDelete"}, {"act": 2, "title": "The tree edge formula", "body": "<p>Every tree with n vertices has n−1 edges. We prove it by induction on n.</p><p><em>Base case:</em> a one-vertex tree has no edges.</p><div class=\"equation\">e = 0 = 1 − 1</div>", "scene": "graph", "graph": "single"}, {"act": 2, "title": "Assume it for every smaller tree", "body": "<p><em>Induction hypothesis:</em> every tree with n−1 vertices has n−2 edges.</p><p>Take an arbitrary tree T with n ≥ 2 vertices. Delete a leaf to get a tree T′ with n−1 vertices.</p><div class=\"equation\">|E(T′)| = n−2</div>", "scene": "leafDelete", "smaller": true}, {"act": 2, "title": "Restore the leaf", "body": "<p>Restore the deleted leaf and its one edge.</p><div class=\"equation\">|E(T)| = |E(T′)| + 1</div><div class=\"equation\">= (n−2) + 1 = n−1</div><p>The base case and inductive step establish the formula for every finite tree.</p>", "scene": "leafDelete", "restore": true}, {"act": 2, "title": "Why not delete any vertex?", "body": "<div class=\"task\"><b>Investigate</b><p>A proposed proof deletes an arbitrary vertex, applies induction, then restores one vertex and one edge. Find both problems. Why does choosing a leaf repair them?</p></div>", "scene": "deleteAudit"}, {"act": 3, "title": "Return to the connection puzzle", "body": "<p>A <em>spanning tree</em> keeps every vertex of G, uses only edges of G, and is a tree.</p><div class=\"equation\">V(T) = V(G)     E(T) ⊆ E(G)</div><p>Every spanning tree of this seven-vertex graph must have six edges.</p>", "scene": "spanningView"}, {"act": 3, "title": "Remove cycle edges", "body": "<p>Start with a connected graph. Delete an edge on a cycle.</p><p>The rest of that cycle still connects its endpoints, so connectedness survives.</p><p>When no cycle remains, the result is a spanning tree.</p>", "scene": "spanningSteps", "method": "delete"}, {"act": 3, "title": "Join different components", "body": "<p>Start with every vertex and no edges.</p><p>Add an edge joining two different current components. This cannot create a cycle.</p><p>Connectedness of the original graph guarantees an available connection until just one component remains.</p>", "scene": "spanningSteps", "method": "add"}, {"act": 3, "title": "Why the two edge counts agree", "body": "<p><em>Fewest edges while connected:</em> a cycle would contain an edge we could remove.</p><p><em>Most edges while acyclic:</em> two components could still be joined using an edge of G.</p><div class=\"equation\">Both constructions finish with n−1 edges.</div>", "scene": "spanningCompare"}, {"act": 3, "title": "Construct two different spanning trees", "body": "<div class=\"task\"><b>Investigate</b><p>Return to the opening graph. Build one spanning tree by cycle-edge deletion and a different one by adding edges without creating a cycle.</p></div><p>Explain why both must finish with six edges.</p>", "scene": "treeEditor"}, {"act": 3, "title": "Is the edge count enough?", "body": "<div class=\"task\"><b>Investigate</b><p>This graph has five vertices and four edges. Is it a tree? Which hypothesis is missing?</p></div><p>Check the definition before using a formula.</p>", "scene": "countTrap"}, {"act": 3, "title": "What makes the count decisive?", "body": "<p><em>Connected and e=n−1 ⇒ tree.</em> A spanning tree already uses all n−1 edges; none remain outside it.</p><p><em>Acyclic and e=n−1 ⇒ tree.</em> A forest with c components has</p><div class=\"equation\">e = Σ(nᵢ−1) = n−c.</div><p>Thus e=n−1 forces c=1.</p>", "scene": "forestCount"}, {"act": 3, "title": "Choose a root", "body": "<p>A <em>rooted tree</em> designates one vertex as the root.</p><p>For every other vertex, the next vertex on the unique path toward the root is its <em>parent</em>. Its other neighbors are its children.</p><p>Changing the root changes relationships, not edges.</p>", "scene": "rootTree"}, {"act": 3, "title": "Parents, siblings, and ancestors", "body": "<p><em>Siblings</em> share a parent.</p><p>The <em>ancestors</em> of a vertex lie on the path from its parent to the root. We exclude the vertex itself.</p><p>A vertex and its descendants form its rooted <em>subtree</em>. A rooted leaf has no children.</p>", "scene": "rootTree"}, {"act": 3, "title": "Read the family relationships", "body": "<div class=\"task\"><b>Investigate</b><p>With root f: find its children, the parent of a, the siblings of d, and the ancestors of a. Then root at a: what becomes the parent of f, and how are f and g related?</p></div><p>Ancestors exclude the vertex itself. A rooted leaf has no children.</p>", "scene": "rootTree", "exercise": true}, {"act": 4, "title": "Left and right are part of the structure", "body": "<p>In an <em>ordered binary tree</em>, every vertex has a left-child position and a right-child position. Either may be empty.</p><p>A child and its descendants form a smaller binary tree.</p><div class=\"task\"><b>Investigate</b><p>Would moving D from the right position to the left position change this ordered tree?</p></div>", "scene": "orderedTree", "supp": true}, {"act": 4, "title": "Which operations must happen first?", "body": "<p>In an expression tree, leaves hold operands and internal vertices hold operators.</p><div class=\"task\"><b>Investigate</b><p>Before evaluating the root +, what must be known about its two child subtrees?</p></div><div class=\"equation\">(2 × (a−1)) + (3 × b)</div>", "scene": "expression", "supp": true}, {"act": 4, "title": "Three recursive visit orders", "body": "<p>For an empty subtree, return. Otherwise recurse on each child subtree and visit the root once.</p><div class=\"rules\"><p><strong>Preorder</strong> root · left · right</p><p><strong>Inorder</strong> left · root · right</p><p><strong>Postorder</strong> left · right · root</p></div>", "scene": "traversal", "supp": true}, {"act": 4, "title": "Traverse a new binary tree", "body": "<div class=\"task\"><b>Investigate</b><p>A has left/right children B,C; B has D,E; C has F,G; E has left child H; F has right child I. Draw the tree, then list preorder, inorder, and postorder.</p></div>", "scene": "binaryTask", "supp": true}, {"act": 4, "title": "Same edge count, different total cost", "body": "<p>Every spanning tree has n−1 edges. With edge weights, their total costs can differ.</p><div class=\"task\"><b>Investigate</b><p>Which two edges connect A, B, C at minimum total cost?</p></div><p>A <em>minimum spanning tree</em> minimizes the sum of its edge weights.</p>", "scene": "weightedTree", "supp": true}, {"act": 4, "title": "Shortest routes are a different objective", "body": "<p>A shortest-path tree from A must preserve a shortest route from A to each vertex.</p><p>Compare the two trees: minimum total network cost need not give the shortest A-to-C route.</p>", "scene": "weightedTree", "compare": true, "supp": true}, {"act": 4, "title": "Greedy algorithms: what each chooses", "body": "<div class=\"rules\"><p><strong>Kruskal</strong> A lightest edge between components.</p><p><strong>Prim</strong> A lightest edge leaving the growing tree.</p><p><strong>Dijkstra</strong> Least tentative distance, then update neighbors.</p></div><p>Dijkstra requires nonnegative weights. Full algorithm analysis comes later.</p>", "scene": "weightedTree", "summary": true, "supp": true}, {"act": 4, "title": "Meeting 18, in one slide", "body": "<ul><li>A tree is connected and acyclic.</li><li>Its paths are unique and its edge count is n−1.</li><li>Leaf deletion makes induction possible.</li><li>Spanning trees resolve the connection puzzle.</li><li>A root gives recursive subtrees and traversals.</li></ul><p>Next: planar drawings and Euler’s formula.</p>", "scene": "graph", "graph": "tree18"}], "meeting": 18};
const $=s=>document.querySelector(s), colors=['#66e5c0','#ff887c','#ffd16f','#b5a0ff','#82bcff'], inks=['#087f6d','#c5473a','#986000','#7451bc','#286bab'];

   if(typeof s.id!=='string'||!/^[a-zA-Z0-9_-]{1,80}$/.test(s.id)||typeof s.text!=='string'||s.text.length>5000||!/^#[0-9a-f]{6}$/i.test(s.color)||![20,24,28,32,40,48,56].includes(s.size)||![s.x,s.y,s.w,s.h].every(Number.isFinite)||s.x<0||s.y<0||s.w<140||s.h<48||s.x+s.w>W||s.y+s.h>H)throw Error('Invalid text box.');
   return {tool:'text',id:s.id,x:s.x,y:s.y,w:s.w,h:s.h,text:s.text,size:s.size,color:s.color};
  },
  print(page,i){for(const s of strokes(i).filter(s=>s.tool==='text')){const box=document.createElement('div');box.className='ink-text-print';applyStyle(box,s);box.append(content(s));page.append(box);}}
 };
}

 function validInt(x,lo,hi){return Number.isInteger(x)&&x>=lo&&x<=hi;}
 function cleanStates(raw){let result={};if(!raw||typeof raw!=='object'||Array.isArray(raw))return result;
  Object.entries(raw).forEach(([key,v])=>{const i=Number(key);if(!validInt(i,0,DECK.slides.length-1)||!v||typeof v!=='object')return;
   const s=DECK.slides[i],max=s.scene==='route'?s.route.length-1:({pathCycle:3,longestPath:2,deleteAudit:2,spanningSteps:6,traversal:9,weightedTree:2,uniqueExplore:1,boundaryWalk:3,spiderModel:3,build:3,districtMap:2}[s.scene]||0);
   const q={step:validInt(v.step,0,max)?v.step:0,toggle:v.toggle===true,palette:validInt(v.palette,0,colors.length-1)?v.palette:0,assigned:[],face:-1};
   const colorCount=s.scene==='districtMap'?districtGraph.p.length:s.scene==='map'?4:s.scene==='colorGraph'?G[s.graph].p.length:0;
   if(Array.isArray(v.assigned))q.assigned=Array.from(v.assigned.slice(0,colorCount),c=>validInt(c,-1,colors.length-1)?c:-1);
   if(s.scene==='faces'&&validInt(v.face,-1,s.graph==='cube'?5:2))q.face=v.face;
   // Feedback is plain text inserted by the base renderer; never restore markup.
   if(typeof v.message==='string')q.message=v.message.slice(0,1000).replace(/[<>&]/g,'');
   if(validInt(v.example,0,s.scene==='countLab'?countExamples.length-1:3))q.example=v.example;
   if(Array.isArray(v.countShown))q.countShown=v.countShown.slice(0,4).map(x=>x===true);
   if(Array.isArray(v.active)&&v.active.length<=12&&v.active.every(x=>validInt(x,0,11)))q.active=[...new Set(v.active)];
   if(v.root===0||v.root===5)q.root=v.root;
   if(['pre','in','post'].includes(v.order))q.order=v.order;
   result[i]=q;
  });return result;
 }
 function validatePayload(data){
  if(!data||!(data.version===1||(TEXT_ENABLED&&data.version===2))||data.deck!==fingerprint||!data.slides||typeof data.slides!=='object'||Array.isArray(data.slides))throw Error(`This backup does not match this version of meeting ${DECK.meeting}.`);
  let result={},total=0;
  for(const [key,list] of Object.entries(data.slides)){
   const i=Number(key);if(!validInt(i,0,DECK.slides.length-1)||!Array.isArray(list)||list.length>10000)throw Error('Invalid slide data.');
   const textIds=new Set();result[i]=list.map(s=>{
    if(s?.tool==='text'&&textTools){const box=textTools.validate(s);if(textIds.has(box.id))throw Error('Duplicate text box.');textIds.add(box.id);return box;}
    if(!s||!['pen','highlight'].includes(s.tool)||!/^#[0-9a-f]{6}$/i.test(s.color)||!Number.isFinite(s.width)||s.width<1||s.width>100||!Array.isArray(s.points)||!s.points.length)throw Error('Invalid ink stroke.');
    total+=s.points.length;if(total>1500000)throw Error('The backup contains too many points.');
    const points=s.points.map(p=>{if(!Array.isArray(p)||p.length!==2||!p.every(Number.isFinite)||p[0]<0||p[0]>W||p[1]<0||p[1]>H)throw Error('Invalid ink coordinates.');return [p[0],p[1]];});
    return {tool:s.tool,color:s.color,width:s.width,points};
   });
  }
  return {slides:result,states:cleanStates(data.states)};
 }
 try{const raw=localStorage.getItem(storageKey);if(raw){const data=validatePayload(JSON.parse(raw));ink=data.slides;state=data.states;}}
 catch(e){loadedWarning='Browser storage could not be loaded. Use backups for this session.';saveFailed=true;}
 function payload(){return {version:TEXT_ENABLED?2:1,deck:fingerprint,title:`CS 241 · Meeting ${DECK.meeting} · ${DECK.title}`,savedAt:new Date().toISOString(),slides:ink,states:cleanStates(state)};}
 function status(message,failed=false){const e=get('ink-save-status');e.textContent=message;e.dataset.failed=failed;e.title=failed?'Automatic browser saving failed. Download an annotation backup.':`Ink${TEXT_ENABLED?', text,':''} and diagram states are saved in this browser, not in the HTML file.`;}
 function saveNow(){clearTimeout(saveTimer);try{localStorage.setItem(storageKey,JSON.stringify(payload()));saveFailed=false;status('Saved locally');}catch(e){saveFailed=true;status('Use backup',true);}}
 function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,180);}
 function elementForStroke(s){let el;
  if(s.points.length===1){el=document.createElementNS(NS,'circle');el.setAttribute('cx',s.points[0][0]);el.setAttribute('cy',s.points[0][1]);el.setAttribute('r',s.width/2);el.setAttribute('fill',s.color);}
  else{el=document.createElementNS(NS,'path');el.setAttribute('d',s.points.map((p,i)=>(i?'L':'M')+p.join(' ')).join(' '));el.setAttribute('fill','none');el.setAttribute('stroke',s.color);el.setAttribute('stroke-width',s.width);el.setAttribute('stroke-linecap','round');el.setAttribute('stroke-linejoin','round');}
  el.setAttribute('opacity',s.tool==='highlight'?'.27':'1');el.setAttribute('class','ink-stroke');return el;
 }
 function drawInk(){raf=0;layer.replaceChildren(...strokes().filter(s=>s.tool!=='text').map(elementForStroke));if(gesture?.stroke&&gesture.slide===index)layer.append(elementForStroke(gesture.stroke));textTools?.render();updateButtons();}
 function requestDraw(){if(!raf)raf=requestAnimationFrame(drawInk);}
 function updateButtons(){get('ink-undo').disabled=!(undo[index]?.length);get('ink-redo').disabled=!(redo[index]?.length);get('ink-clear').disabled=!strokes().length;}
 function remember(i,before){(undo[i]||(undo[i]=[])).push(before);if(undo[i].length>100)undo[i].shift();redo[i]=[];}
 function finishGesture(cancel=false){textTools?.finish();if(!gesture)return;const g=gesture;gesture=null;
  if(g.stroke&&!cancel){remember(g.slide,strokes(g.slide));ink[g.slide]=[...strokes(g.slide),g.stroke];}
  if(g.before){if(cancel)ink[g.slide]=g.before;else if(g.erased)remember(g.slide,g.before);}
  if(layer.hasPointerCapture(g.pointerId))layer.releasePointerCapture(g.pointerId);
  drawInk();saveNow();
 }
 function useMode(next){finishGesture();if(toolbar.contains(document.activeElement))document.activeElement.blur();mode=next;layer.classList.toggle('ink-enabled',mode!=='use');for(const name of ['use','pen','highlight','erase',...(TEXT_ENABLED?['text']:[])])get('ink-'+name).setAttribute('aria-pressed',name===mode);
  get('ink-color').disabled=!['pen','highlight','text'].includes(mode);get('ink-width').disabled=!['pen','highlight'].includes(mode);get('ink-color').value=mode==='text'?textTools.color():colorsForTool[mode]||colorsForTool.pen;textTools?.setMode(mode);
 }
 function undoInk(){finishGesture();if(!undo[index]?.length)return;(redo[index]||(redo[index]=[])).push(strokes());ink[index]=undo[index].pop();drawInk();saveNow();}
 function redoInk(){finishGesture();if(!redo[index]?.length)return;(undo[index]||(undo[index]=[])).push(strokes());ink[index]=redo[index].pop();drawInk();saveNow();}
 function point(e){const r=layer.getBoundingClientRect();return [Math.round(Math.max(0,Math.min(W,(e.clientX-r.left)*W/r.width))*10)/10,Math.round(Math.max(0,Math.min(H,(e.clientY-r.top)*H/r.height))*10)/10];}
 function pointSegment(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],len=dx*dx+dy*dy,t=len?Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/len)):0;return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy);}
 function segmentsDistance(a,b,c,d){const cross=(u,v,w)=>(v[0]-u[0])*(w[1]-u[1])-(v[1]-u[1])*(w[0]-u[0]);let x=cross(a,b,c),y=cross(a,b,d),z=cross(c,d,a),w=cross(c,d,b);
  if(((x>0&&y<0)||(x<0&&y>0))&&((z>0&&w<0)||(z<0&&w>0)))return 0;
  return Math.min(pointSegment(a,c,d),pointSegment(b,c,d),pointSegment(c,a,b),pointSegment(d,a,b));
 }
 function eraseBetween(a,b){const g=gesture;if(!g)return;const before=strokes(g.slide);ink[g.slide]=before.filter(s=>{if(s.tool==='text')return true;const radius=10+s.width/2;if(s.points.length===1)return pointSegment(s.points[0],a,b)>radius;for(let j=1;j<s.points.length;j++)if(segmentsDistance(a,b,s.points[j-1],s.points[j])<=radius)return false;return true;});if(ink[g.slide].length!==before.length)g.erased=true;requestDraw();}
 layer.addEventListener('pointerdown',e=>{if(mode==='use'||gesture||(e.pointerType==='mouse'&&e.button!==0))return;e.preventDefault();const p=point(e),eraser=mode==='erase'||e.button===5;
  if(mode==='text'){textTools.add(p);return;}
  gesture={slide:index,pointerId:e.pointerId,last:p};layer.setPointerCapture(e.pointerId);
  if(eraser){gesture.before=strokes();gesture.erased=false;eraseBetween(p,p);}else gesture.stroke={tool:mode,color:colorsForTool[mode],width:mode==='highlight'?width*6:width,points:[p]};requestDraw();
 });
 layer.addEventListener('pointermove',e=>{if(!gesture||e.pointerId!==gesture.pointerId)return;e.preventDefault();const samples=e.getCoalescedEvents?.()||[],events=samples.length?samples:[e];
  for(const sample of events){const p=point(sample);if(gesture.before)eraseBetween(gesture.last,p);else if(Math.hypot(p[0]-gesture.last[0],p[1]-gesture.last[1])>.5)gesture.stroke.points.push(p);gesture.last=p;}requestDraw();
 });
 layer.addEventListener('pointerup',e=>{if(!gesture||e.pointerId!==gesture.pointerId)return;e.preventDefault();const p=point(e);if(gesture.before)eraseBetween(gesture.last,p);else if(Math.hypot(p[0]-gesture.last[0],p[1]-gesture.last[1])>.5)gesture.stroke.points.push(p);finishGesture();});
 layer.addEventListener('pointercancel',e=>{if(gesture?.pointerId===e.pointerId)finishGesture(true);});
 layer.addEventListener('lostpointercapture',e=>{if(gesture?.pointerId===e.pointerId)finishGesture();});
 for(const name of ['use','pen','highlight','erase'])get('ink-'+name).onclick=()=>useMode(name);
 if(TEXT_ENABLED){get('ink-text').onclick=()=>useMode('text');for(const [id,label] of [['ink-undo','Undo annotation on this slide (Ctrl+Z)'],['ink-redo','Redo annotation on this slide (Ctrl+Shift+Z)'],['ink-clear','Clear ink and text on this slide (undo available)'],['ink-more','Annotation backup, printing, and help'],['ink-color','Annotation color']]){get(id).title=label;get(id).setAttribute('aria-label',label);}}
 get('ink-undo').onclick=undoInk;get('ink-redo').onclick=redoInk;
 get('ink-clear').onclick=()=>{finishGesture();if(!strokes().length)return;remember(index,strokes());ink[index]=[];drawInk();saveNow();};
 get('ink-color').oninput=e=>{if(mode==='text')textTools.setColor(e.target.value);else if(['pen','highlight'].includes(mode))colorsForTool[mode]=e.target.value;};
 get('ink-width').onchange=e=>width=Number(e.target.value);
 get('ink-menu').querySelector('#ink-close').onclick=()=>menu.close();
 const menuButton=get('ink-more');
 menuButton.onclick=()=>{finishGesture();get('ink-menu-message').textContent=saveFailed?'Browser saving is unavailable. Download a backup to keep your annotations.':`Backups include ink${TEXT_ENABLED?', text,':''} and diagram states for all slides.`;get('ink-menu-message').dataset.failed=saveFailed;menu.showModal();};
 get('ink-export').onclick=()=>{finishGesture();const blob=new Blob([JSON.stringify(payload(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`meeting-${DECK.meeting}-ink${TEXT_ENABLED?'-text':''}-backup.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);get('ink-menu-message').textContent='Annotation backup downloaded.';get('ink-menu-message').dataset.failed=false;};
 get('ink-load').onclick=()=>{fileInput.value='';fileInput.click();};
 fileInput.onchange=async()=>{const f=fileInput.files[0];if(!f)return;try{if(f.size>40000000)throw Error('The backup file is too large.');const loaded=validatePayload(JSON.parse(await f.text()));finishGesture();clearInterval(timer);timer=null;for(let i=0;i<DECK.slides.length;i++)remember(i,strokes(i));ink=loaded.slides;state=loaded.states;render();saveNow();get('ink-menu-message').textContent='Backup loaded. Previous ink is available with Undo on each slide.';get('ink-menu-message').dataset.failed=false;}catch(e){get('ink-menu-message').textContent='Could not load backup: '+e.message;get('ink-menu-message').dataset.failed=true;}};
 get('ink-print').onclick=()=>{finishGesture();menu.close();window.print();};
 // Run before the original keyboard listener, without changing its navigation keys.
 document.addEventListener('keydown',e=>{if(document.querySelector('dialog[open]')||e.target.closest('input,select,textarea')||e.altKey)return;const key=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&key==='z'){e.preventDefault();e.stopImmediatePropagation();e.shiftKey?redoInk():undoInk();return;}
  if((e.ctrlKey||e.metaKey)&&key==='y'){e.preventDefault();e.stopImmediatePropagation();redoInk();return;}
  if(e.ctrlKey||e.metaKey)return;const map={v:'use',p:'pen',h:'highlight',e:'erase',...(TEXT_ENABLED?{t:'text'}:{})};if(map[key]){e.preventDefault();e.stopImmediatePropagation();useMode(map[key]);}
 },true);
 const baseRender=render;
 render=function(){finishGesture();baseRender();document.title+=TEXT_ENABLED?' · Ink + text copy':' · Ink copy';drawInk();scheduleSave();};
 // The base print listener runs first; replace its reflowed pages with exact-layout pages.
 addEventListener('beforeprint',()=>{finishGesture();clearInterval(timer);timer=null;const old=index,container=get('print');container.replaceChildren();
  DECK.slides.forEach((s,i)=>{index=i;const page=document.createElement('section');page.className='ink-print-page';
   page.innerHTML=`<div class="brand"><b>CS 241</b>MEETING ${DECK.meeting}</div><article class="ink-print-slide ${s.cover?'cover':''}"><div class="eyebrow">${s.act===0?'Opening investigation':`Act ${s.act} / ${DECK.acts[s.act]}`}</div><h1>${s.title}</h1><div class="content"><div class="text">${s.body}</div><div class="visual">${renderScene(s,st())}</div></div></article><footer class="footer"><span>Meeting ${DECK.meeting} · ${DECK.title}</span><span>${i+1} / ${DECK.slides.length}</span></footer>`;
   const svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('class','ink-print-svg');strokes(i).filter(s=>s.tool!=='text').forEach(s=>svg.append(elementForStroke(s)));page.append(svg);textTools?.print(page,i);container.append(page);
  });index=old;
 });
 addEventListener('pagehide',()=>{finishGesture();saveNow();});
 addEventListener('blur',()=>finishGesture());
 useMode('use');baseRender();document.title+=TEXT_ENABLED?' · Ink + text copy':' · Ink copy';drawInk();
 if(loadedWarning)status('Use backup',true);else status(Object.keys(ink).length?(TEXT_ENABLED?'Notes restored':'Ink restored'):'Ready');
})();
</script></body></html>
