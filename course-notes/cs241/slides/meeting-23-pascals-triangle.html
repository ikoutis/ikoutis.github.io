<dialog id="overview"><button onclick="this.closest('dialog').close()">Close</button><h2>Meeting 23 · Pascal’s triangle</h2><div id="overviewList" class="overview-list"></div></dialog><div id="print" class="print-only"></div><noscript>This interactive lecture requires JavaScript.</noscript>
<script>const DECK={"meeting": 23, "title": "Pascal’s triangle", "copyLabel": false, "acts": ["Rook paths", "Constructing Pascal’s triangle", "Lattice paths, bit strings, and subsets", "Pascal’s recurrence and symmetry", "Row and diagonal identities", "Review and applications"], "slides": [{"act": 0, "title": "Rook paths", "body": "<p>Move one square right or down at each step. The endpoint is fixed; the order of the moves can change.</p><div class=\"task\"><b>Try it first</b><p>Build a path. How could we count every possible path?</p></div>", "scene": "rook", "rows": 7, "cols": 7, "cover": true, "id": "m23-content-01"}, {"act": 0, "title": "Listing rook paths", "body": "<div class=\"task\"><b>Try it first</b><p>A rook starts at the upper-left square and moves only one square down or right. List all paths to the square two rows down and two columns right. Then count paths to the square three rows down and two columns right by separating paths according to their final move.</p></div>", "scene": "rook", "rows": 2, "cols": 2, "activity": "collect", "id": "m23-content-02"}, {"act": 1, "title": "Constructing Pascal’s triangle", "body": "<p>Boundary values, the recurrence, and row and column notation.</p>", "scene": "section", "id": "m23-section-1", "section": true, "identities": []}, {"act": 1, "title": "Boundary path counts", "body": "<div class=\"task\"><b>Try it first</b><p>Count the paths to each square on the top edge and left edge.</p></div><p>A boundary route has no choice of direction. The starting square has one path of length zero.</p>", "scene": "gridCounts", "activity": "boundary", "rows": 4, "cols": 4, "id": "m23-content-03"}, {"act": 1, "title": "Path counts by final move", "body": "<div class=\"task\"><b>Try it first</b><p>Reach the square three rows down and two columns right. Which paths finish with D? Which finish with R?</p></div><p>Every path belongs to exactly one of these two groups.</p>", "scene": "rook", "rows": 3, "cols": 2, "activity": "split", "id": "m23-content-04"}, {"act": 1, "title": "Recurrence for path counts", "body": "<p>Let P(r,c) count routes with r down moves and c right moves.</p><div class=\"equation\">P(r,c) = P(r−1,c) + P(r,c−1)</div><div class=\"task\"><b>Try it first</b><p>Select an interior square. Explain both terms before revealing its count.</p></div>", "scene": "gridCounts", "activity": "recurrence", "rows": 4, "cols": 4, "id": "m23-content-05"}, {"act": 1, "title": "From path grid to Pascal’s triangle", "body": "<p>A square r moves down and c moves right is r+c steps from the start.</p><div class=\"task\"><b>Try it first</b><p>Follow one diagonal. Then rearrange the grid by total path length.</p></div>", "scene": "gridTriangle", "id": "m23-content-06"}, {"act": 1, "title": "Constructing Pascal’s triangle", "body": "<p>Begin and end each row with 1. Each interior entry is the sum of its two predecessors.</p><div class=\"task\"><b>Try it first</b><p>Select an interior entry. Which two entries produce it?</p></div>", "scene": "triangle", "activity": "parents", "n": 6, "k": 3, "id": "m23-content-07"}, {"act": 1, "title": "Constructing rows 5 and 6", "body": "<div class=\"task\"><b>Try it first</b><p>Starting with rows 0 through 4 of Pascal's triangle, 1; 1,1; 1,2,1; 1,3,3,1; 1,4,6,4,1, construct rows 5 and 6. State the boundary rule and the rule for every interior entry.</p></div>", "scene": "triangle", "activity": "fill", "n": 5, "k": 0, "id": "m23-content-08"}, {"act": 1, "title": "Binomial coefficient notation", "body": "<p>Rows and columns both start at 0. The entry in row n and column k is</p><div class=\"equation\"><span class=\"binom\" aria-label=\"n choose k\"><span>n</span><span>k</span></span> — “n choose k.”</div><div class=\"task\"><b>Try it first</b><p>Locate row 4, column 2. What would row 0, column 0 mean?</p></div>", "scene": "triangle", "activity": "notation", "n": 4, "k": 2, "maxrow": 4, "id": "m23-content-09"}, {"act": 2, "title": "Lattice paths, bit strings, and subsets", "body": "<p>Lattice paths, bit strings, subsets, and the bijections between them.</p>", "scene": "section", "id": "m23-section-2", "section": true, "identities": []}, {"act": 2, "title": "Lattice paths and position choices", "body": "<p>A shortest path from (0,0) to (4,7) has eleven moves: four right and seven up.</p><div class=\"task\"><b>Try it first</b><p>Choose which seven of the eleven positions are up moves. What remains undecided?</p></div>", "scene": "models", "id": "m23-lattice-path-positions", "layout": "wide-visual", "activity": "lattice", "n": 11, "k": 7}, {"act": 2, "title": "Bit-string length and weight", "body": "<p>A bit string is a sequence of 0s and 1s. Its <em>length</em> is the number of positions; its <em>weight</em> is the number of 1s.</p><div class=\"task\"><b>Try it first</b><p>Change the bits. Record the length and weight before and after each change.</p></div>", "scene": "models", "id": "m23-bit-string-length-weight", "activity": "bits", "n": 5, "k": 3, "bits": [1, 0, 1, 0, 1]}, {"act": 2, "title": "Counting strings of fixed weight", "body": "<p>Each weight-3 string has exactly three selected positions among five.</p><div class=\"task\"><b>Try it first</b><p>Construct a string of weight 3. Then inspect the whole set. How can we know the list is complete?</p></div>", "scene": "models", "activity": "catalog", "n": 5, "k": 3, "id": "m23-content-12"}, {"act": 2, "title": "Subsets and incidence strings", "body": "<p>Fix the coordinate order 1,2,…,n. Put a 1 in position i exactly when i belongs to the subset.</p><div class=\"task\"><b>Try it first</b><p>Choose a subset, then encode it. What does its size become?</p></div>", "scene": "models", "activity": "subsets", "n": 5, "k": 3, "bits": [1, 0, 1, 0, 1], "id": "m23-content-13"}, {"act": 2, "title": "Paths, bit strings, and subsets", "body": "<div class=\"task\"><b>Try it first</b><p>Find one binomial coefficient that answers all three questions: shortest lattice paths from (0,0) to (4,3); 7-bit strings of weight 3; and 3-element subsets of a 7-element set. Explain which three positions or objects are being chosen in each model.</p></div>", "scene": "models", "activity": "three", "n": 7, "k": 3, "id": "m23-content-14"}, {"act": 2, "title": "Encoding and decoding subsets", "body": "<div class=\"task\"><b>Try it first</b><p>Using coordinate order 1,2,3,4,5,6, encode {1,3,5,6} as a bit string and decode 001010 as a subset. Explain why this correspondence preserves subset size as bit-string weight.</p></div>", "scene": "encode", "id": "m23-content-15"}, {"act": 2, "title": "Bijections between counting models", "body": "<p>A subset determines exactly one bit string. Reading its 1-positions recovers exactly the original subset.</p><div class=\"task\"><b>Try it first</b><p>Change one representation. Explain how to reconstruct it from either of the others.</p></div>", "scene": "models", "activity": "three", "n": 5, "k": 3, "bits": [1, 0, 1, 0, 1], "id": "m23-content-16"}, {"act": 3, "title": "Pascal’s recurrence and symmetry", "body": "<p>Case splits for the recurrence; complementation and reflection for symmetry.</p>", "scene": "section", "id": "m23-section-3", "section": true, "identities": ["recurrence", "symmetry"]}, {"act": 3, "title": "Partitioning strings by their last bit", "body": "<p>Consider all six-bit strings of weight three.</p><div class=\"task\"><b>Try it first</b><p>Group them by their last bit. What happens to length and weight when that bit is removed?</p></div>", "scene": "split", "n": 6, "k": 3, "identity": "recurrence", "id": "m23-content-17"}, {"act": 3, "title": "Pascal’s recurrence: bit-string proof", "body": "<p>For 1 ≤ k ≤ n−1, every n-bit string of weight k ends in exactly one of 0 and 1.</p><div class=\"task\"><b>Try it first</b><p>Count each group. Give the inverse operation that recovers the original string.</p></div>", "scene": "proof", "proof": "lastBit", "identity": "recurrence", "id": "m23-content-18"}, {"act": 3, "title": "Subsets with a distinguished element", "body": "<p>The last position can instead stand for a distinguished element x.</p><div class=\"task\"><b>Try it first</b><p>Sort the three-element subsets of {1,…,6} by whether they contain 6. Remove 6 from the first group.</p></div>", "scene": "split", "activity": "subsets", "n": 6, "k": 3, "identity": "recurrence", "id": "m23-content-19"}, {"act": 3, "title": "Pascal’s recurrence: subset proof", "body": "<div class=\"task\"><b>Try it first</b><p>Let S be an n-element set with distinguished element x. Partition the k-element subsets of S into those containing x and those omitting it. Count each part and derive <span class=\"binom\" aria-label=\"n choose k\"><span>n</span><span>k</span></span>=<span class=\"binom\" aria-label=\"n−1 choose k−1\"><span>n−1</span><span>k−1</span></span>+<span class=\"binom\" aria-label=\"n−1 choose k\"><span>n−1</span><span>k</span></span>.</p></div>", "scene": "proof", "proof": "subset", "identity": "recurrence", "id": "m23-content-20"}, {"act": 3, "title": "Boundary binomial coefficients", "body": "<p>There is one empty subset and one full subset.</p><div class=\"task\"><b>Try it first</b><p>What happens when n = 0? How many different subsets are there then?</p></div>", "scene": "boundary", "n": 4, "identity": "boundary", "id": "m23-content-21"}, {"act": 3, "title": "Symmetry by complementation", "body": "<p>A k-element subset has an (n−k)-element complement.</p><div class=\"task\"><b>Try it first</b><p>Complement the selected subset twice. Why does this establish a bijection?</p></div>", "scene": "complement", "n": 6, "bits": [1, 0, 1, 0, 0, 0], "identity": "symmetry", "id": "m23-content-22"}, {"act": 3, "title": "Symmetry by path reflection", "body": "<p>Reflection across y=x exchanges right and up moves.</p><div class=\"task\"><b>Try it first</b><p>Build a path to (4,3). Reflect it. What is the new endpoint?</p></div>", "scene": "reflect", "n": 7, "k": 3, "bits": [1, 0, 1, 0, 0, 1, 0], "identity": "symmetry", "id": "m23-content-23"}, {"act": 4, "title": "Row and diagonal identities", "body": "<p>Row sums, the hockey-stick identity, and their counting arguments.</p>", "scene": "section", "id": "m23-section-4", "section": true, "identities": ["rowSum", "hockey"]}, {"act": 4, "title": "Subsets grouped by size", "body": "<p>The kth entry counts subsets of size k.</p><div class=\"task\"><b>Try it first</b><p>Sort all subsets of a four-element set by size. Does any subset occur twice? Is any omitted?</p></div>", "scene": "rowSum", "n": 4, "identity": "rowSum", "id": "m23-content-24"}, {"act": 4, "title": "The row-sum identity", "body": "<p>Each of n positions has two possibilities: included or omitted.</p><div class=\"task\"><b>Try it first</b><p>Explain why adding the counts for sizes 0 through n counts the same collection.</p></div>", "scene": "rowSum", "n": 5, "activity": "proof", "identity": "rowSum", "id": "m23-content-25"}, {"act": 4, "title": "The hockey-stick identity", "body": "<div class=\"task\"><b>Try it first</b><p>Add the highlighted diagonal entries. Find their total elsewhere in the triangle.</p></div><p>Change the diagonal or its endpoint. Which pattern persists?</p>", "scene": "hockey", "n": 5, "k": 2, "identity": "hockey", "id": "m23-content-26"}, {"act": 4, "title": "Hockey-stick identity: recurrence proof", "body": "<p>Use the recurrence repeatedly, starting at the top of the highlighted diagonal.</p><div class=\"task\"><b>Try it first</b><p>Combine the running sum with the next entry. Which entry replaces them?</p></div>", "scene": "hockey", "n": 5, "k": 2, "activity": "proof", "identity": "hockey", "id": "m23-content-27"}, {"act": 4, "title": "Path cases for the first up move", "body": "<p>For paths to (4,3), the first up move may occur after 0,1,2,3, or 4 right moves.</p><div class=\"task\"><b>Try it first</b><p>Fix that first up move. Count the remaining path. Why are these five cases disjoint?</p></div>", "scene": "firstUp", "identity": "hockey", "id": "m23-content-28"}, {"act": 4, "title": "Verifying triangle identities", "body": "<div class=\"task\"><b>Try it first</b><p>Use rows 5 and 6 of Pascal's triangle to verify one numerical example of each pattern: mirror symmetry <span class=\"binom\" aria-label=\"n choose k\"><span>n</span><span>k</span></span>=<span class=\"binom\" aria-label=\"n choose n−k\"><span>n</span><span>n−k</span></span>, row sum Σ<sub>k=0</sub><sup>n</sup><span class=\"binom\" aria-label=\"n choose k\"><span>n</span><span>k</span></span>=2<sup>n</sup>, and the local Pascal recurrence.</p></div>", "scene": "triangle", "activity": "identities", "n": 6, "k": 3, "id": "m23-content-29"}, {"act": 5, "title": "Review and applications", "body": "<p>Applications of the counting models and a review of their proofs.</p>", "scene": "section", "id": "m23-section-5", "section": true, "identities": []}, {"act": 5, "title": "Counting paths across the chessboard", "body": "<div class=\"task\"><b>Try it first</b><p>How many right and down moves does a corner-to-corner path use? Which row and column give its count?</p></div><p>Explain the encoding before looking up the entry.</p>", "scene": "rook", "rows": 7, "cols": 7, "activity": "return", "id": "m23-content-30"}, {"act": 5, "title": "Choosing a counting model", "body": "<div class=\"task\"><b>Try it first</b><p>Select the correct count, then explain what n and k mean in each case.</p></div><p>A path length is the sum of the two coordinate changes.</p>", "scene": "quiz", "id": "m23-content-31"}, {"act": 5, "title": "Writing a counting proof", "body": "<p>Name the objects. Fix the correspondence or the case split. Explain why no object is lost or counted twice.</p><div class=\"task\"><b>Try it first</b><p>Choose one identity from today and explain its equality without calculating either side.</p></div>", "scene": "proof", "proof": "strategy", "id": "m23-content-32"}, {"act": 5, "title": "Pascal’s triangle: summary", "body": "<ul><li>Boundary ones and predecessor sums build the triangle.</li><li>Paths, bit strings, and subsets encode the same choices.</li><li>A case split proves the recurrence.</li><li>Bijections explain symmetry.</li><li>Row and diagonal sums count complete collections.</li></ul><p><em>Next:</em> counting in stages, cases, and overlapping sets.</p>", "scene": "triangle", "activity": "summary", "n": 6, "k": 3, "id": "m23-content-33"}], "identities": {"recurrence": {"name": "Pascal’s recurrence", "formula": "<span class=\"binom\" aria-label=\"n choose k\"><span>n</span><span>k</span></span> = <span class=\"binom\" aria-label=\"n−1 choose k\"><span>n−1</span><span>k</span></span> + <span class=\"binom\" aria-label=\"n−1 choose k−1\"><span>n−1</span><span>k−1</span></span>", "conditions": "n ≥ 2, 1 ≤ k ≤ n−1"}, "boundary": {"name": "Boundary coefficients", "formula": "<span class=\"binom\" aria-label=\"n choose 0\"><span>n</span><span>0</span></span> = <span class=\"binom\" aria-label=\"n choose n\"><span>n</span><span>n</span></span> = 1", "conditions": "n ≥ 0"}, "symmetry": {"name": "Symmetry", "formula": "<span class=\"binom\" aria-label=\"n choose k\"><span>n</span><span>k</span></span> = <span class=\"binom\" aria-label=\"n choose n−k\"><span>n</span><span>n−k</span></span>", "conditions": "n ≥ 0, 0 ≤ k ≤ n"}, "rowSum": {"name": "Row-sum identity", "formula": "<span class=\"identity-sum\"><span>n</span><span>∑</span><span>k=0</span></span><span class=\"binom\" aria-label=\"n choose k\"><span>n</span><span>k</span></span> = 2<sup>n</sup>", "conditions": "n ≥ 0"}, "hockey": {"name": "Hockey-stick identity", "formula": "<span class=\"identity-sum\"><span>n</span><span>∑</span><span>i=k</span></span><span class=\"binom\" aria-label=\"i choose k\"><span>i</span><span>k</span></span> = <span class=\"binom\" aria-label=\"n+1 choose k+1\"><span>n+1</span><span>k+1</span></span>", "conditions": "0 ≤ k ≤ n"}}};'use strict';
const $=s=>document.querySelector(s),C={teal:'#087f6d',blue:'#286bab',purple:'#7451bc',gold:'#986000',coral:'#c5473a',ink:'#172439',muted:'#526078'};
let state={},index=0,timer=null;
const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const range=(a,b)=>Array.from({length:Math.max(0,b-a+1)},(_,i)=>a+i);
const setText=a=>a.length?'{'+a.join(', ')+'}':'∅';
const weight=a=>a.reduce((x,y)=>x+y,0);
const positions=a=>a.flatMap((x,i)=>x?[i+1]:[]);
const binom=(n,k)=>`<span class="binom" aria-label="${esc(n)} choose ${esc(k)}"><span>${esc(n)}</span><span>${esc(k)}</span></span>`;
function count(n,k){if(!Number.isInteger(n)||!Number.isInteger(k)||n<0||k<0||k>n)return 0;k=Math.min(k,n-k);let v=1;for(let i=1;i<=k;i++)v=v*(n-k+i)/i;return Math.round(v);}
function strings(n,k){if(n===0)return k===0?[[]]:[];if(k<0||k>n)return[];return [...strings(n-1,k).map(x=>[0,...x]),...strings(n-1,k-1).map(x=>[1,...x])];}
function allStrings(n){return range(0,n).flatMap(k=>strings(n,k));}
const btn=(label,action,extra='')=>`<button type="button" data-action="${action}" ${extra}>${label}</button>`;
const select=(key,label,values,current)=>`<label>${label}<select data-setting="${key}" aria-label="${label}">${values.map(v=>`<option value="${v}" ${current===v?'selected':''}>${v}</option>`).join('')}</select></label>`;
const svg=(body,label,view='0 0 820 370')=>`<svg viewBox="${view}" role="group" aria-label="${esc(label)}">${body}</svg>`;
const txt=(x,y,t,size=22,color=C.ink,extra='')=>`<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="${size}" fill="${color}" ${extra}>${esc(t)}</text>`;
const controls=body=>`<div class="controls">${body}</div>`;
const status=body=>`<div class="status ${body.includes('class="binom"')?'has-math':''}" aria-live="polite">${body}</div>`;
function freshState(s){const n=s.scene==='encode'?6:(s.n??5);return {n,k:s.k??2,bits:s.bits?[...s.bits]:Array(n).fill(0),bits2:Array(6).fill(0),path:'',saved:[],r:2,c:2,reveal:false,all:false,checked:false,step:0,toggle:false,entries:{},entry:'',message:'',j:0,answers:['?','?','?','?']};}
function st(){return state[index]||(state[index]=freshState(DECK.slides[index]));}
function cleanDeckStates(raw){const out={},integer=(v,a,b)=>Number.isInteger(v)&&v>=a&&v<=b;if(!raw||typeof raw!=='object'||Array.isArray(raw))return out;
 for(const [key,v] of Object.entries(raw)){const i=Number(key);if(!integer(i,0,DECK.slides.length-1)||!v||typeof v!=='object'||Array.isArray(v))continue;const s=DECK.slides[i],q=freshState(s);
  for(const [k,a,b] of [['n',0,11],['k',0,11],['r',0,4],['c',0,4],['step',0,12],['j',0,4]])if(integer(v[k],a,b))q[k]=v[k];
  if(s.scene==='rowSum')q.n=Math.min(5,q.n);if(s.scene==='hockey')q.n=Math.min(7,q.n);if(['boundary','complement'].includes(s.scene))q.n=Math.min(6,q.n);if(['models','split','reflect'].includes(s.scene))q.n=s.n;if(s.scene==='encode')q.n=6;
  q.k=Math.min(q.k,q.n);for(const key of ['reveal','all','checked','toggle'])q[key]=v[key]===true;
  if(Array.isArray(v.bits)&&v.bits.length===q.n&&v.bits.every(x=>x===0||x===1))q.bits=[...v.bits];else q.bits=Array(q.n).fill(0);
  if(Array.isArray(v.bits2)&&v.bits2.length===6&&v.bits2.every(x=>x===0||x===1))q.bits2=[...v.bits2];
  const validPath=x=>typeof x==='string'&&/^[DR]*$/.test(x)&&x.length<=14&&x.split('D').length-1<=(s.rows??7)&&x.split('R').length-1<=(s.cols??7);

 function migratePayload(data){

   const i=Number(key);if(!validInt(i,0,DECK.slides.length-1)||!Array.isArray(list)||list.length>10000)throw Error('Invalid slide data.');
   const textIds=new Set();result[i]=list.map(s=>{
